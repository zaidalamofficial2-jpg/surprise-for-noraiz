  async function paintNotes(p) {
    const notes = await api('/api/notes' + q('&kind=note'));
    p.innerHTML = `<div class="card mb"><h3>New note</h3><div class="grid g3"><label class="f" style="grid-column:span 2">Title<input type="text" id="nTitle" placeholder="e.g. Rules of debit and credit"></label><label class="f">Subject${subjSel('nSub', filter || S.lastSubject)}</label></div><label class="f mt-s">Note<textarea id="nBody" rows="5" placeholder="Write your note…"></textarea></label><div class="row mt-s"><button class="btn" id="nSave">${icon('save')} Save note</button></div></div>
      <div class="grid g-auto">${notes.length ? notes.map(n => `<div class="card" data-id="${n.id}"><div class="row between"><span class="chip" style="color:${subjOf(n.subject).color}">${esc(subjOf(n.subject).short)}</span><span class="muted sm-t">${ago(n.ts)}</span></div><h3 class="mt-s">${esc(n.title)}</h3><div class="note-body sm-t" style="max-height:200px;overflow:auto">${md(n.body)}</div><div class="row mt-s"><button class="btn sm ghost" data-a="edit">${icon('edit')} Edit</button><button class="btn sm ghost" data-a="rev">${icon('flag')} Revise</button><button class="btn sm danger" data-a="del">${icon('trash')}</button></div></div>`).join('') : `<div class="card" style="grid-column:1/-1">${empty('edit', 'No notes yet', 'Write a note above, or save a teacher’s answer from the classroom.')}</div>`}</div>`;
    $('#nSave', p).onclick = async () => { const title = $('#nTitle', p).value.trim(), body = $('#nBody', p).value.trim(); if (!body) return toast('Write something first.', 'err'); try { await api('/api/notes', { method: 'POST', body: { subject: $('#nSub', p).value, title, body } }); toast('Note saved', 'ok'); paintNotes(p); } catch (e) { errToast(e); } };
    p.onclick = async e => {
      const b = e.target.closest('[data-a]'); if (!b) return; const id = +b.closest('[data-id]').dataset.id; const n = notes.find(x => x.id === id);
      if (b.dataset.a === 'del' && await confirmDialog('Delete this note?', 'Delete', true)) { await api('/api/notes/' + id, { method: 'DELETE' }); paintNotes(p); }
      if (b.dataset.a === 'rev') { await api('/api/revision', { method: 'POST', body: { subject: n.subject, text: n.title } }); toast('Added to revision list', 'ok'); }
      if (b.dataset.a === 'edit') { const m = modal(`<h3>Edit note</h3><label class="f">Title<input type="text" id="eT" value="${esc(n.title)}"></label><label class="f mt-s">Note<textarea id="eB" rows="10">${esc(n.body)}</textarea></label><div class="row mt" style="justify-content:flex-end"><button class="btn ghost" data-close>Cancel</button><button class="btn" id="eOk">Save</button></div>`, { wide: true }); $('#eOk', m.el).onclick = async () => { await api('/api/notes/' + id, { method: 'PUT', body: { title: $('#eT', m.el).value, body: $('#eB', m.el).value } }); m.close(); paintNotes(p); }; }
    };
  }

  async function paintSummaries(p) {
    const items = await api('/api/notes' + q('&kind=summary'));
    p.innerHTML = `<div class="card mb"><h3>Generate a chapter summary</h3><div class="grid g3"><label class="f">Subject${subjSel('sSub', filter || S.lastSubject)}</label><label class="f" style="grid-column:span 2">Topic / chapter<select id="sTop"></select></label></div><label class="f mt-s">Or paste text to summarise (optional – overrides the topic)<textarea id="sText" rows="4" placeholder="Paste your notes or a chapter…"></textarea></label><div class="row mt-s"><button class="btn" id="sGo">${icon('sparkles')} Generate summary</button><span class="muted sm-t">Tip: to summarise an uploaded file, use the “Summary” button in the Study Library.</span></div></div>
      <div class="grid">${items.length ? items.map(n => `<div class="card" data-id="${n.id}"><div class="row between"><div><span class="chip" style="color:${subjOf(n.subject).color}">${esc(subjOf(n.subject).short)}</span> <span class="muted sm-t">${ago(n.ts)}</span></div><div class="row gap-s"><button class="icon-btn" data-a="read" title="Read aloud">${icon('speaker')}</button><button class="icon-btn" data-a="rev" title="Add to revision">${icon('flag')}</button><button class="icon-btn" data-a="del" title="Delete">${icon('trash')}</button></div></div><h3 class="mt-s">${esc(n.title)}</h3>${md(n.body)}</div>`).join('') : `<div class="card">${empty('file', 'No summaries yet', 'Generate your first chapter summary above.')}</div>`}</div>`;
    const fill = () => $('#sTop', p).innerHTML = topicOptions($('#sSub', p).value, 'Choose a topic…'); fill(); $('#sSub', p).onchange = fill;
    $('#sGo', p).onclick = async e => { const topic = $('#sTop', p).value, text = $('#sText', p).value; if (!topic && !text.trim()) return toast('Choose a topic or paste text.', 'err'); const btn = e.currentTarget; btn.disabled = true; toast('Writing summary…'); try { await api('/api/notes/summarize', { method: 'POST', body: { subject: $('#sSub', p).value, topic, text } }); toast('Summary ready', 'ok'); paintSummaries(p); } catch (er) { errToast(er); btn.disabled = false; } };
    p.onclick = async e => { const b = e.target.closest('[data-a]'); if (!b) return; const id = +b.closest('[data-id]').dataset.id; const n = items.find(x => x.id === id);
      if (b.dataset.a === 'del' && await confirmDialog('Delete this summary?', 'Delete', true)) { await api('/api/notes/' + id, { method: 'DELETE' }); paintSummaries(p); }
      if (b.dataset.a === 'rev') { await api('/api/revision', { method: 'POST', body: { subject: n.subject, text: n.title.replace(/^Summary:\s*/, '') } }); toast('Added to revision list', 'ok'); }
      if (b.dataset.a === 'read') Voice.speaking ? Voice.stop() : Voice.speak(n.body); };
    S.cleanup = () => Voice.stop(true);
  }

  async function paintCards(p) {
    const cards = await api('/api/flashcards' + q());
    let idx = 0, studyList = cards, onlyHard = false;
    function studyHtml() {
      if (!studyList.length) return empty('cards', onlyHard ? 'No difficult cards' : 'No flashcards yet', 'Generate or add some below.');
      const c = studyList[idx % studyList.length];
      return `<div class="row between mb"><span class="chip">Card ${idx % studyList.length + 1} / ${studyList.length}</span><label class="row sm-t" style="gap:.4rem"><input type="checkbox" id="onlyHard" ${onlyHard ? 'checked' : ''}> Difficult only</label></div>
        <div class="fc" id="fc"><div class="fc-in"><div class="fc-face">${esc(c.front)}</div><div class="fc-face fc-back">${esc(c.back)}</div></div></div><div class="muted sm-t center mt-s">Click the card to flip · ${esc(subjOf(c.subject).short)}${c.topic ? ' · ' + esc(c.topic) : ''}</div>
        <div class="row mt wrap" style="justify-content:center"><button class="btn ghost" id="fPrev">Previous</button><button class="btn ${c.difficult ? 'gold' : 'soft'}" id="fHard">${icon('flag')} ${c.difficult ? 'Marked difficult' : 'Mark difficult'}</button><button class="btn" id="fNext">Next</button><button class="btn danger sm" id="fDel">${icon('trash')}</button></div>`;
    }
    p.innerHTML = `<div class="grid g2 mb"><div class="card"><h3>Study mode</h3><div id="study"></div></div>
      <div class="card"><h3>Create flashcards</h3><div class="grid g2"><label class="f">Subject${subjSel('cSub', filter || S.lastSubject)}</label><label class="f">How many<input type="number" id="cN" min="3" max="30" value="10"></label></div><label class="f mt-s">Topic<select id="cTop"></select></label><div class="row mt-s"><button class="btn" id="cGen">${icon('sparkles')} Generate with AI</button></div>
        <hr style="border:0;border-top:1px solid var(--line);margin:1rem 0"><h3>Add your own</h3><label class="f">Front<input type="text" id="mF" placeholder="Question or term"></label><label class="f mt-s">Back<textarea id="mB" rows="2" placeholder="Answer"></textarea></label><div class="row mt-s"><button class="btn soft" id="mAdd">Add card</button></div><div class="muted sm-t mt-s">Tip: cards can also be created from an uploaded document in the Study Library.</div></div></div>`;
    const paintStudy = () => { $('#study', p).innerHTML = studyHtml(); wireStudy(); };
    function wireStudy() {
      const fc = $('#fc', p); if (!fc) return; const c = studyList[idx % studyList.length]; fc.onclick = () => fc.classList.toggle('flip');
      $('#fNext', p).onclick = () => { idx++; paintStudy(); }; $('#fPrev', p).onclick = () => { idx = (idx - 1 + studyList.length) % studyList.length; paintStudy(); };
      $('#fHard', p).onclick = async () => { const r = await api('/api/flashcards/' + c.id, { method: 'PATCH', body: { difficult: !c.difficult } }); Object.assign(c, r); paintStudy(); };
      $('#fDel', p).onclick = async () => { if (!(await confirmDialog('Delete this flashcard?', 'Delete', true))) return; await api('/api/flashcards/' + c.id, { method: 'DELETE' }); const k = cards.indexOf(c); if (k >= 0) cards.splice(k, 1); studyList = onlyHard ? cards.filter(x => x.difficult) : cards; paintStudy(); };
      $('#onlyHard', p).onchange = e => { onlyHard = e.target.checked; studyList = onlyHard ? cards.filter(x => x.difficult) : cards; idx = 0; paintStudy(); };
    }
    paintStudy();
    const fill = () => $('#cTop', p).innerHTML = topicOptions($('#cSub', p).value, 'Choose a topic…'); fill(); $('#cSub', p).onchange = fill;
    $('#cGen', p).onclick = async e => { const topic = $('#cTop', p).value; if (!topic) return toast('Choose a topic.', 'err'); e.currentTarget.disabled = true; toast('Creating flashcards…'); try { await api('/api/flashcards/generate', { method: 'POST', body: { subject: $('#cSub', p).value, topic, count: +$('#cN', p).value } }); toast('Flashcards created', 'ok'); paintCards(p); } catch (er) { errToast(er); $('#cGen', p).disabled = false; } };
    $('#mAdd', p).onclick = async () => { const front = $('#mF', p).value.trim(), back = $('#mB', p).value.trim(); if (!front || !back) return toast('Fill both sides.', 'err'); try { await api('/api/flashcards', { method: 'POST', body: { subject: $('#cSub', p).value, topic: $('#cTop', p).value, front, back } }); toast('Card added', 'ok'); paintCards(p); } catch (er) { errToast(er); } };
  }

  async function paintRevision(p) {
    const items = (await api('/api/revision')).filter(r => !filter || r.subject === filter);
    p.innerHTML = `<div class="grid g2"><div class="card"><h3>Quick revision of a concept</h3><div class="grid g2"><label class="f">Subject${subjSel('rSub', filter || S.lastSubject)}</label><label class="f">Concept<input type="text" id="rCon" placeholder="e.g. Bank reconciliation"></label></div><div class="row mt-s"><button class="btn" id="rGo">${icon('bulb')} Revise now</button></div><div id="rOut" class="mt"></div></div>
      <div class="card"><h3>Personal revision list</h3><div class="row"><input type="text" id="rNew" placeholder="Add a difficult topic or concept…"><button class="btn" id="rAdd">Add</button></div><div class="list mt">${items.length ? items.map(r => `<div class="chk ${r.done ? 'done' : ''}" data-id="${r.id}"><input type="checkbox" ${r.done ? 'checked' : ''} data-a="tog" aria-label="Done"><div class="grow tx">${esc(r.text)}<div class="muted sm-t">${esc(subjOf(r.subject).short)}</div></div><button class="btn sm soft" data-a="go">Revise</button><button class="icon-btn" style="width:32px;height:32px" data-a="del" aria-label="Remove">${icon('trash')}</button></div>`).join('') : empty('flag', 'Revision list is empty', 'Use the flag button in the classroom to save difficult topics.')}</div></div></div>`;
    $('#rGo', p).onclick = async e => { const concept = $('#rCon', p).value.trim(); if (!concept) return toast('Enter a concept.', 'err'); await revise($('#rSub', p).value, concept, e.currentTarget); };
    async function revise(subject, concept, btn) { if (btn) btn.disabled = true; $('#rOut', p).innerHTML = loading('Preparing revision…'); try { const r = await api('/api/revise-concept', { method: 'POST', body: { subject, concept } }); $('#rOut', p).innerHTML = `<div class="explain">${md(r.reply)}</div><div class="row mt-s"><button class="btn sm ghost" id="rSpeak">${icon('speaker')} Read aloud</button><button class="btn sm ghost" id="rSave">${icon('save')} Save as note</button></div>`; $('#rSpeak', p).onclick = () => Voice.speaking ? Voice.stop() : Voice.speak(r.reply); $('#rSave', p).onclick = async () => { await api('/api/notes', { method: 'POST', body: { subject, title: 'Revision: ' + concept, body: r.reply } }); toast('Saved to notes', 'ok'); }; } catch (e) { $('#rOut', p).innerHTML = ''; errToast(e); } if (btn) btn.disabled = false; }
    $('#rAdd', p).onclick = async () => { const text = $('#rNew', p).value.trim(); if (!text) return; try { await api('/api/revision', { method: 'POST', body: { subject: $('#rSub', p).value, text } }); paintRevision(p); } catch (e) { errToast(e); } };
    $('#rNew', p).onkeydown = e => { if (e.key === 'Enter') $('#rAdd', p).click(); };
    p.onclick = async e => { const b = e.target.closest('[data-a]'); if (!b || !b.closest('[data-id]')) return; const id = +b.closest('[data-id]').dataset.id; const r = items.find(x => x.id === id);
      if (b.dataset.a === 'tog') { await api('/api/revision/' + id, { method: 'PATCH', body: { done: b.checked } }); paintRevision(p); }
      if (b.dataset.a === 'del') { await api('/api/revision/' + id, { method: 'DELETE' }); paintRevision(p); }
      if (b.dataset.a === 'go') { $('#rSub', p).value = r.subject; $('#rCon', p).value = r.text; revise(r.subject, r.text); $('#rOut', p).scrollIntoView({ behavior: 'smooth' }); } };
    S.cleanup = () => Voice.stop(true);
  }
  shell();
}, 'Notes & Flashcards');

</script>
<script>
'use strict';
/* Progress dashboard + settings */
route('mocktests', async (el) => {
  const subjects = stageSubjects();
  const stage = currentStageInfo();
  const colors = ['#168575', '#df682b', '#8242ad', '#3978b8', '#b28a2e', '#c34c76'];
  el.innerHTML = `${setupBanner()}
    <div class="page-head"><div><span class="chip">${esc(stage.title)}</span><h1>Mock Tests</h1></div></div>
    <section class="banner mb" style="background:#fff5dc;color:#a7772c;border-radius:18px;padding:1.1rem 1.25rem">
      <div class="grow"><b>Mock-test content is coming soon</b><div class="sm-t" style="margin-top:.25rem">The subject sections are ready. Questions, timing and test materials will be added later.</div></div>
    </section>
    <div class="grid g2">${subjects.map((s,i)=>{
      const c = s.color || colors[i % colors.length];
      const code = s.code || String(i+1).padStart(2,'0');
      return `<article class="card" style="border-top:5px solid ${esc(c)};border-radius:22px;padding:1.25rem;box-shadow:0 8px 24px rgba(30,40,80,.08)">
        <div class="row" style="align-items:center;gap:1rem">
          <div class="avatar" style="--c:${esc(c)};width:3.7rem;height:3.7rem;flex:0 0 3.7rem">${icon(s.icon||'book')}</div>
          <div class="grow"><b style="font-size:1.1rem">${esc(code)}</b><div style="font-size:1.05rem;line-height:1.45;margin-top:.2rem">${esc(s.name||s.short||'Subject')}</div></div>
        </div>
        <div class="row between wrap mt-s" style="align-items:center;gap:.6rem">
          <span class="chip">Coming soon</span>
          <button class="btn" type="button" disabled style="opacity:.65;cursor:not-allowed">Not available yet</button>
        </div>
      </article>`;
    }).join('')}</div>
    ${subjects.length ? '' : '<p class="muted mt">No subjects are available for this stage yet.</p>'}`;
}, 'Mock Tests');

route('progress', async (el) => {
  const p = await api('/api/progress');
  const visibleSubjects = stageSubjects();
  const visibleIds = new Set(visibleSubjects.map(s => s.id));
  const stageData = p.subjects.filter(s => visibleIds.has(s.id));
  const tests = p.testHistory.filter(t => visibleIds.has(t.subject));
  const weak = p.weak.filter(w => visibleIds.has(w.subject));
  const stageDone = stageData.reduce((a, s) => a + s.topicsDone, 0);
  const stageTotal = stageData.reduce((a, s) => a + s.topicsTotal, 0);
  const stagePct = stageTotal ? Math.round(100 * stageDone / stageTotal) : 0;
  const stageAttempts = stageData.reduce((a, s) => a + s.attempted, 0);
  const stageCorrect = stageData.reduce((a, s) => a + (s.attempted * (s.accuracy || 0) / 100), 0);
  const stageAccuracy = stageAttempts ? Math.round(100 * stageCorrect / stageAttempts) : null;
  const timeItems = p.timeline.map(d => ({ label: shortDay(d.day), v: Math.round(d.seconds / 60) }));
  const accPts = p.accTimeline.map(d => d.accuracy);
  const improving = (() => { const a = p.accTimeline.filter(d => d.accuracy !== null); if (a.length < 2) return null; const h = Math.ceil(a.length / 2); const avg = x => x.reduce((s, d) => s + d.accuracy, 0) / x.length; return Math.round(avg(a.slice(h)) - avg(a.slice(0, h))); })();
  el.innerHTML = `
    <div class="page-head"><div><h1>Progress</h1><p>Everything is saved on this computer and is still here when you reopen the app.</p></div><a class="btn" href="#/practice">${icon('target')} Practise weak areas</a></div>
    <div class="grid g5 mb keep">
      <div class="card stat"><div class="l">${esc(currentStageInfo().title)}</div><div class="v">${stagePct}%</div><div class="muted sm-t">${stageDone} / ${stageTotal} topics completed</div></div>
      <div class="card stat"><div class="l">Stage MCQs attempted</div><div class="v">${stageAttempts}</div><div class="muted sm-t">${Math.round(stageCorrect)} correct</div></div>
      <div class="card stat"><div class="l">Stage MCQ accuracy</div><div class="v">${stageAccuracy === null ? '—' : stageAccuracy + '%'}</div><div class="muted sm-t">${improving === null ? 'not enough data' : improving >= 0 ? `<span style="color:var(--ok)">▲ ${improving}% improving</span>` : `<span style="color:var(--bad)">▼ ${-improving}% dropping</span>`}</div></div>
      <div class="card stat"><div class="l">Total study time · all stages</div><div class="v">${fmtDur(p.totalSeconds)}</div><div class="muted sm-t">today ${fmtDur(p.todaySeconds)}</div></div>
      <div class="card stat"><div class="l">Streak</div><div class="v">${p.streak.streak}🔥</div><div class="muted sm-t">best ${p.streak.best} days</div></div>
    </div>
    <h2>${esc(currentStageInfo().title)} · subject progress</h2><p class="muted sm-t">${appFeatureAllowed('curriculum') ? 'Other stages are available while Pro access is active.' : 'Your free-plan access is fixed to this selected stage. Pro members can explore all stages.'}</p>
    <div class="grid g3 mb">${stageData.map(s => `<div class="card" style="border-top:4px solid ${s.color}"><div class="row"><div class="avatar" style="--c:${s.color}">${icon(s.icon)}</div><div class="grow"><b>${esc(s.short)}</b><div class="muted sm-t">${esc(s.teacher)}</div></div>${ring(s.progress, { size: 64, color: s.color })}</div>
      <div class="grid g2 keep mt" style="gap:.6rem"><div><div class="muted sm-t">Topics completed</div><b>${s.topicsDone} / ${s.topicsTotal}</b></div><div><div class="muted sm-t">MCQs attempted</div><b>${s.attempted}</b></div><div><div class="muted sm-t">MCQ accuracy</div><b>${s.accuracy === null ? '—' : s.accuracy + '%'}</b></div><div><div class="muted sm-t">Avg test score</div><b>${s.avgTest === null ? '—' : s.avgTest + '%'}</b></div><div><div class="muted sm-t">Study time</div><b>${fmtDur(s.studySeconds)}</b></div><div><div class="muted sm-t">Tests taken</div><b>${s.testsTaken}</b></div></div>
      <details class="mt-s"><summary class="muted sm-t" style="cursor:pointer">Topics completed (${s.topicsDone})</summary>${s.completedTopics.length ? `<ul class="sm-t" style="padding-left:1.1rem;margin:.4rem 0 0">${s.completedTopics.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : '<div class="muted sm-t">None yet — tick topics in the classroom syllabus.</div>'}</details></div>`).join('')}</div>
    <div class="grid g2 mb">
      <div class="card"><h3>Daily study time (minutes, last 14 days)</h3>${barChart(timeItems, { unit: 'm' })}</div>
      <div class="card"><h3>MCQ accuracy over time (last 14 days)</h3>${accPts.some(v => v !== null) ? lineChart([{ name: 'Accuracy', color: 'var(--primary)', points: accPts }], { labels: p.accTimeline.map(d => shortDay(d.day)) }) : empty('chart', 'No MCQ data yet', 'Practise some questions to see your accuracy trend.')}</div>
    </div>
    <div class="grid g2">
      <div class="card"><h3>Test scores & improvement</h3>${tests.length ? `${lineChart(visibleSubjects.map(s => ({ name: s.short, color: s.color, points: tests.filter(t => t.subject === s.id).map(t => t.pct) })).filter(s => s.points.length), { labels: Array.from({ length: Math.max(...visibleSubjects.map(s => tests.filter(t => t.subject === s.id).length)) }, (_, i) => '#' + (i + 1)) })}<div class="row wrap sm-t">${visibleSubjects.map(s => `<span class="chip"><i style="width:9px;height:9px;border-radius:50%;background:${s.color};display:inline-block"></i> ${esc(s.short)}</span>`).join('')}</div>` : empty('clock', 'No tests yet', '<a href="#/tests">Take your first daily test</a>')}</div>
      <div class="card"><h3>Weak areas</h3>${weak.length ? `<div class="list">${weak.map(w => `<div class="row"><div class="grow"><div>${esc(w.topic)}</div><div class="muted sm-t">${esc(subjOf(w.subject).short)} · ${w.attempts} attempts</div></div><span class="chip bad">${w.accuracy}%</span><a class="btn sm soft" href="#/practice" data-p="${esc(w.subject)}|${esc(w.topic)}">Practise</a></div>`).join('')}</div>` : empty('target', 'No weak areas yet', 'Chapters with under 70% accuracy (after 2+ attempts) will show here.')}</div>
    </div>`;
  $$('[data-p]', el).forEach(a => a.onclick = () => { const [s, t] = a.dataset.p.split('|'); S.presetPractice = { subject: s, topic: t }; });
}, 'Progress');

route('settings', async (el) => {
  const st = await api('/api/settings'); await refreshStatus();
  const cfgAI = window.LocalBackend ? await api('/api/ai-config') : null;
  const fixedStage = lockedStudentStage();
  const adminFixedStage = !!fixedStage && studentStageAccess().mode === 'fixed';
  const freeStageLocked = !!fixedStage && !adminFixedStage;
  const voices = Voice.supportsTTS ? Voice.voices.length : 0;
  const teacherGroups = ['Operational Level','Managerial Level','Strategic Level','Practical Training Modules'];
  const teacherEditorHtml = isStudentEdition() ? '' : `<section class="card mt"><div class="row between wrap"><div><h3>AI Teacher Directory</h3><p class="muted sm-t">Edit the display name of any of the 24 subject teachers. These names are also used in the teacher's AI instructions.</p></div><button class="btn sm" id="teacherSave">${icon('save')} Save teacher names</button></div>${teacherGroups.map(g => `<h4 class="mt">${esc(g)}</h4><div class="teacher-grid">${S.cur.filter(s => s.level === g).map(s => `<label class="f">${esc(s.code)} · ${esc(s.name)}<input type="text" data-teacher-name="${s.id}" value="${esc(s.teacher)}" maxlength="60"></label>`).join('')}</div>`).join('')}</section>`;
  el.innerHTML = `<div class="page-head"><div><h1>Settings</h1><p>Personalise your academy.</p></div></div>
    <div class="grid g2">
      <div class="card"><h3>Profile & goals</h3>
        <label class="f">Your name<input type="text" id="sName" value="${esc(st.name)}" maxlength="40"></label>
        <label class="f mt-s">Date of birth<input type="date" id="sDob" value="${esc(st.dob || '')}" max="${new Date().toISOString().slice(0, 10)}"></label>
        <label class="f mt-s">Daily study goal (minutes)<input type="number" id="sGoal" min="5" max="600" value="${st.dailyGoalMin}"></label>

    const perms = { ...cfg, ...(record?.permissions || {}), allowStudentApiKey: true };
    $$('[data-permission]', el).forEach(i => i.checked = ['personalSettings','developer'].includes(i.dataset.permission) ? true : perms[i.dataset.permission] !== false);
    $('#exportStudentApp', el).innerHTML = record ? `${icon('refresh')} Update &amp; re-export student file` : `${icon('file')} Create student file`;
    $('#cancelStudentEdit', el).classList.toggle('hide', !record);
    $('#builderStatus', el).textContent = record ? `Editing ${record.label || 'this student'} · the same student storage ID is preserved. Enter the current password or choose a new one.` : '';
  }
  $('#fStageMode', el).onchange = syncStageControls;
  $('#fPro', el).onchange = syncProControls;
  $('#fGen', el).onclick = () => { $('#fPass', el).value = makePassword(); $('#fPass', el).type = 'text'; };
  $('#savePermissions', el).onclick = async () => {
    try { await api('/api/publish-config', { method:'PUT', body: collect() }); $('#builderStatus', el).textContent = 'Default feature choices saved in this master app.'; toast('Choices saved', 'ok'); }
    catch(e) { errToast(e); }
  };
  $('#cancelStudentEdit', el).onclick = () => setEditMode(null);
  $('#createdStudents', el).onclick = async e => {
    const remove = e.target.closest('[data-remove-student]');
    if (remove) {
      const slug = remove.dataset.removeStudent, record = log.find(x => x.slug === slug);
      if (!record || !(await confirmDialog(`Remove ${record.label || 'this student'} from the master app's local list? Their already-downloaded standalone file will NOT be remotely disabled.`, 'Remove student', true))) return;
      log = log.filter(x => x.slug !== slug);
      try { localStorage.setItem('za.createdFiles', JSON.stringify(log)); } catch { /* ignore */ }
      if (editSlug === slug) setEditMode(null);
      renderRecords();
      $('#builderStatus', el).textContent = 'Student removed from this browser’s list. Their existing downloaded file is still usable until its own expiry; immediate revocation needs a hosted server.';
      return;
    }
    const b = e.target.closest('[data-edit-student]'); if (!b) return;
    const record = log.find(x => x.slug === b.dataset.editStudent); if (!record) return;
    setEditMode(record); $('#fLabel', el).focus();
  };
  $('#exportStudentApp', el).onclick = async () => {
    const status = $('#builderStatus', el), permissions = collect(), btn = $('#exportStudentApp', el);
    try {
      const existing = editSlug ? log.find(x => x.slug === editSlug) : null;
      const label = $('#fLabel', el).value.trim();
      const stageMode = $('#fStageMode', el).value;
      const lockedStage = $('#fLockedStage', el).value;
      const proAccess = $('#fPro', el).checked;
      const proAccessUntil = $('#fExpiry', el).value;
      let password = $('#fPass', el).value;
      let generatedPassword = false;
      if (!label) { $('#fLabel', el).focus(); throw new Error('Please enter a name to identify this student in your admin list.'); }
      if (!['student','fixed'].includes(stageMode)) throw new Error('Choose who can select the CMA stage.');
      if (stageMode === 'fixed' && !STUDY_STAGES.some(x => x.key === lockedStage)) throw new Error('Choose the CMA stage to lock for this student.');
      if (proAccess && !proAccessUntil) { $('#fExpiry', el).focus(); throw new Error('Choose the date when this student’s Pro access should expire.'); }
      if (proAccessUntil && proAccessUntil < new Date().toISOString().slice(0,10)) { $('#fExpiry', el).focus(); throw new Error('The Pro expiry date must be today or a future date.'); }
      if (!password && !existing) { password = makePassword(); generatedPassword = true; }
      if (password.length < 8) { $('#fPass', el).focus(); throw new Error(existing ? 'For an existing student, enter the current password or set a new password (at least 8 characters).' : 'The password must be at least 8 characters.'); }
      if (!(window.crypto && crypto.subtle)) throw new Error('This browser cannot encrypt files. Open your master app in Chrome or Edge.');
      btn.disabled = true; status.textContent = 'Preparing the protected student file…';
      await api('/api/publish-config', { method:'PUT', body: permissions });
      const slug = existing ? existing.slug : Array.from(crypto.getRandomValues(new Uint8Array(8)), x => x.toString(16).padStart(2, '0')).join('');
      const stageAccess = { mode: stageMode, stage: stageMode === 'fixed' ? lockedStage : '' };
      const root = document.documentElement.cloneNode(true);
      root.removeAttribute('data-theme');
      ['nav', 'view', 'modalRoot', 'toasts', 'menuBtn', 'themeBtn', 'themeBtn2'].forEach(id => { const n = root.querySelector('#' + id); if (n) n.innerHTML = ''; });
      root.querySelectorAll('.main > .banner').forEach(n => n.remove());
      let pdfs = null, build = null;
      root.querySelectorAll('body script').forEach(sc => {
        const t = sc.textContent.trim();
        if (t.startsWith('window.__PDFS=')) { pdfs = JSON.parse(t.slice(14).replace(/;$/, '')); sc.remove(); }
        else if (t.startsWith('window.__BUILD=')) { build = JSON.parse(t.slice(15).replace(/;$/, '')); sc.remove(); }
        else sc.setAttribute('type', 'text/x-app');
      });
      if (!pdfs || !build) throw new Error('Student files can only be created from your single-file master app (the built HTML), not from the developer server.');
      const teacherNames = Object.fromEntries(S.curAll ? S.curAll.map(s => [s.id, s.teacher]) : S.cur.map(s => [s.id, s.teacher]));
      const payload = { pdfs, build: { ...build, student: '', slug, teacherNames, studentProfile: null, studentProfileVersion: null, stageAccess, proAccess, proAccessUntil: proAccess ? proAccessUntil : '' } };
      const enc = await zaEncrypt(password, payload); enc.slug = slug;
      const head = Array.from(root.querySelectorAll('head script')).find(x => x.textContent.includes('window.__APP_PERMISSIONS'));
      if (!head) throw new Error('Student permission placeholder is missing.');
      head.textContent = '\nwindow.__APP_PERMISSIONS = ' + JSON.stringify(permissions) + ';\nwindow.__ENC = ' + JSON.stringify(enc) + ';\n';
      const gate = document.createElement('script'); gate.textContent = '(' + zaGateRuntime.toString() + ')();'; root.querySelector('body').appendChild(gate);
      const output = '<!doctype html>\n' + root.outerHTML;
      const fname = 'ZA-CMA-' + label.replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '').slice(0, 35) + '.html';
      const blob = new Blob([output], { type: 'text/html;charset=utf-8' }); const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000);
      const locked = features.filter(([k]) => permissions[k] === false).length;
      const profileVersion = Number(existing?.profileVersion || 0) + 1;
      const record = { label, slug, at: Date.now(), locked, explore: !!permissions.curriculum, permissions, stageAccess, proAccess, proAccessUntil: proAccess ? proAccessUntil : '', profile: existing?.profile || null, profileVersion };
      const idx = log.findIndex(x => x.slug === slug); if (idx >= 0) log[idx] = record; else log.push(record);
      log = log.slice(-50);
      try { localStorage.setItem('za.createdFiles', JSON.stringify(log)); } catch { /* ignore */ }
      renderRecords(); setEditMode(null);
      status.innerHTML = `${existing ? 'Updated' : 'Created'} <b>${esc(fname)}</b> (${(output.length / 1048576).toFixed(1)} MB). Student chooses their own name and DOB when first opening the file. ${proAccess ? 'Pro access until ' + esc(proAccessUntil) + '; all features stay open during this period. Your selected restrictions apply after expiry.' : 'Free plan: 40 different MCQs per subject; only unchecked features are locked.'}${generatedPassword ? `<div class="mt-s"><b>Generated password — save it now:</b> <code id="generatedPassValue">${esc(password)}</code> <button class="btn sm ghost" type="button" id="copyGeneratedPass">Copy password</button></div>` : ' Password set successfully.'}`;
      const copy = $('#copyGeneratedPass', el); if (copy) copy.onclick = async () => { try { await navigator.clipboard.writeText(password); toast('Password copied', 'ok'); } catch { toast('Select and copy the password manually.', 'err'); } };
      toast(existing ? 'Student file updated' : 'Student file created', 'ok');
    } catch(e) { status.textContent = e.message || 'Export failed.'; errToast(e); }
    finally { btn.disabled = false; }
  };
  renderRecords(); setEditMode(null);
  const adminLogout = $('#zaAdminLogout', el); if (adminLogout) adminLogout.onclick = zaAdminLogout;
}, 'Student App Builder');

</script>
<script>
'use strict';
/* Boot */
(function guard() { // show unexpected errors instead of failing silently
  const show = m => { try { toast('Something went wrong: ' + String(m).slice(0, 160), 'err'); } catch { /* ignore */ } };
  window.addEventListener('error', e => { if (e.message && !/ResizeObserver|Script error/.test(e.message)) show(e.message); });
  window.addEventListener('unhandledrejection', e => { const m = e.reason && e.reason.message || e.reason; if (m) show(m); });
})();
(async function boot() {
  setupShell();
  try { view().innerHTML = loading('Opening your academy…'); } catch { /* ignore */ }
  setTimeout(() => { try { if (view().querySelector('.loading')) view().innerHTML = `<div class="banner bad">${icon('alert')}<div><b>Still loading…</b>This is taking too long. Close any other tabs of this app, then reload this page. If you opened the file inside WhatsApp or another app, save it and open it in Chrome. Your progress is safe.</div></div>`; } catch { /* ignore */ } }, 15000);
  try { S.cur = await api('/api/curriculum'); } catch (e) {
    view().innerHTML = `<div class="banner bad">${icon('alert')}<div><b>Cannot start the academy</b>${esc(e.message)}</div></div>`; return;
  }
  renderNav(); await refreshStatus();
  if (S.status.standalone && S.status.storage === 'mem') {
    const b = document.createElement('div'); b.className = 'banner'; b.style.cssText = 'margin:1rem clamp(1rem,2.4vw,2rem) 0';
    b.innerHTML = `${icon('alert')}<div><b>Your progress will NOT be saved here</b>This page is running inside a preview/sandbox, where the browser blocks storage (and often the microphone and downloads). Download the file and open it directly in Chrome or Edge (double-click it) to keep your data and use voice.</div>`;
    $('.main').insertBefore(b, view());
  }
  try { S.settings = await api('/api/settings'); } catch { /* defaults */ }
  if (isStudentEdition()) { installStudentCopyDeterrents(); applyStudentWatermark(); }
  const enforcedStage = lockedStudentStage();
  if (enforcedStage) {
    S.studyStage = enforcedStage;
    if (S.settings.stage !== enforcedStage) { S.settings.stage = enforcedStage; try { await api('/api/settings', { method: 'PUT', body: { stage: enforcedStage } }); } catch { /* local fallback */ } }
  } else if (isStudentEdition() && STUDY_STAGES.some(x => x.key === S.settings.stage)) S.studyStage = S.settings.stage;
  applyStageFilter(S.cur.slice()); renderNav();
  renderRoute();
  if (isStudentEdition()) { if (!S.settings.profileDone) profileSetup(); }
  else if (S.status.standalone && S.status.needsName) welcome();
  if (isStudentEdition() && window.__BUILD && window.__BUILD.proAccess === true && window.__BUILD.proAccessUntil) {
    let wasActive = isProAccessActive();
    window.setInterval(() => {
      const activeNow = isProAccessActive();
      if (wasActive && !activeNow) { wasActive = false; applyStageFilter(S.curAll || S.cur); renderNav(); navigate('#/dashboard'); toast('Your Pro access period has ended. Your selected CMA stage is now fixed, and free MCQ practice remains available.', 'err'); }
    }, 30000);
  }
  document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('#bkNow'); if (b) downloadBackup().then(() => { toast('Backup downloaded'); b.closest('.banner').remove(); }).catch(errToast); });
})();

function welcome() {
  const m = modal(`<h3>Welcome to ZA CMA Learning Hub</h3><p class="muted">Enter your name so your progress, notes and flashcards are saved under it on this device.</p>
    <label class="f">Your name<input type="text" id="wName" maxlength="40" placeholder="e.g. Ali Khan"></label>
    <label class="f mt-s">Exam date (optional)<input type="date" id="wExam"></label>
    <div class="row mt" style="justify-content:flex-end"><button class="btn" id="wOk">Start learning</button></div>`, {});
  const inp = $('#wName', m.el); inp.focus();
  const go = async () => { const name = inp.value.trim(); if (!name) { inp.focus(); return toast('Please type your name', 'err'); }
    try { S.settings = await api('/api/settings', { method: 'PUT', body: { name, examDate: $('#wExam', m.el).value || '' } }); } catch (e) { return errToast(e); }
    m.close(); await refreshStatus(); renderRoute(); };
  $('#wOk', m.el).onclick = go; inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}

/* First open of a student file: the student introduces themselves. Nothing from the owner's copy exists here. */
function profileSetup() {
  const exploreOk = appFeatureAllowed('curriculum');
  const fixedStage = lockedStudentStage();
  const adminFixedStage = !!fixedStage && studentStageAccess().mode === 'fixed';
  const stageControl = fixedStage
    ? `<select id="pStage" disabled><option value="${fixedStage}" selected>${esc(STUDY_STAGES.find(g => g.key === fixedStage).title)} · ${adminFixedStage ? 'Locked by administrator' : 'Fixed on free plan'}</option></select>`
    : `<select id="pStage"><option value="">Select your stage…</option>${STUDY_STAGES.map(g => `<option value="${g.key}">${esc(g.title)} (${esc(g.subtitle)})</option>`).join('')}</select>`;
  const stageNote = adminFixedStage ? 'Your administrator has fixed your study stage. You can still enter your own name and date of birth.' : (exploreOk ? 'Choose your CMA stage. On the free plan, this choice is saved once and cannot be changed later. Pro members can explore and switch between stages.' : 'Choose your CMA stage once. On the free plan, this stage stays fixed; contact the developer to ask about Pro access.');
  const m = modal(`<h3>Welcome to ZA CMA Learning Hub</h3><p class="muted">Enter your own details. The name used by the administrator is only for their student list; it does not set your profile.</p>
    <label class="f">Your full name<input type="text" id="pName" maxlength="40" autocomplete="name" placeholder="Enter the name you want to use"></label>
    <label class="f mt-s">Date of birth<input type="date" id="pDob" max="${new Date().toISOString().slice(0, 10)}"></label>
    <label class="f mt-s">Your CMA stage${stageControl}</label>
    <p class="muted sm-t mt-s">${stageNote}</p>
    <div class="row mt" style="justify-content:flex-end"><button class="btn" id="pOk">Start learning</button></div>`, { sticky: true });
  const go = async () => {
    const name = $('#pName', m.el).value.trim(), dob = $('#pDob', m.el).value, stage = $('#pStage', m.el).value;
    if (!name) { $('#pName', m.el).focus(); return toast('Please type your name', 'err'); }
    if (!dob) { $('#pDob', m.el).focus(); return toast('Please choose your date of birth', 'err'); }
    if (!stage) { $('#pStage', m.el).focus(); return toast('Please choose your stage', 'err'); }
    try { S.settings = await api('/api/settings', { method: 'PUT', body: { name, dob, stage, profileDone: true } }); } catch (e) { return errToast(e); }
    S.settings = await api('/api/settings'); applyStudentWatermark(); setStudyStage(stage); applyStageFilter(S.curAll || S.cur); renderNav(); m.close(); await refreshStatus(); navigate('#/dashboard'); renderRoute();
  };
  $('#pOk', m.el).onclick = go; $('#pName', m.el).focus();
}

</script>
