<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎂 Surprise for Noraiz</title>
<style>
:root{--ink:#2b1b3d;--pink:#ff4d8d;--yel:#ffd23f;--teal:#19c3b1;--cream:#fff7ec}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,#ffb36b,#ff6a95 55%,#8e5cf5);background-attachment:fixed}
.dots{position:fixed;inset:0;background-image:radial-gradient(#fff3 2px,transparent 2px);background-size:34px 34px;animation:dr 20s linear infinite}
@keyframes dr{to{background-position:340px 340px}}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center;opacity:0;pointer-events:none;transform:scale(.96);transition:.6s;overflow-y:auto}
.stage.on{opacity:1;pointer-events:auto;transform:none}
.big{font-size:clamp(26px,7vw,46px);font-weight:900;color:#fff;text-shadow:0 4px 0 #0003;line-height:1.1}
.sub{color:#fff;opacity:.92;margin-top:8px;font-size:clamp(14px,4vw,18px)}
.btn{background:var(--yel);color:var(--ink);border:0;border-bottom:5px solid #d9a800;border-radius:18px;padding:14px 30px;font-size:18px;font-weight:900;cursor:pointer;margin-top:18px;font-family:inherit}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn.pk{background:var(--pink);color:#fff;border-bottom-color:#c21f62}
.hide{display:none!important}
/* lock */
#t0{background:#0000}
.clock{font-size:clamp(70px,22vw,120px);font-weight:900;color:#fff;letter-spacing:-3px;line-height:1}
.date{color:#fff;opacity:.9;margin:4px 0 30px}
.notif{background:#fffffff0;border-radius:22px;padding:16px 18px;display:flex;gap:14px;align-items:center;text-align:left;width:min(92vw,420px);box-shadow:0 14px 40px #0004;animation:buzz 2.5s infinite;cursor:pointer}
.notif .ic{font-size:40px}.notif b{display:block;font-size:17px}.notif small{opacity:.7}
@keyframes buzz{0%,86%,100%{transform:none}90%{transform:translateX(-6px) rotate(-1deg)}94%{transform:translateX(6px) rotate(1deg)}}
.cd{font-weight:900;color:#fff;background:#0003;border-radius:16px;padding:10px 18px;margin:-12px 0 22px;font-size:clamp(16px,4.5vw,22px);letter-spacing:1px}
.notif.lk{filter:grayscale(.6);opacity:.9;animation:none}
.tap{margin-top:26px;color:#fff;opacity:.85;animation:bl 1.4s infinite}
@keyframes bl{50%{opacity:.25}}
.pick{margin-top:18px;color:#fff;font-size:13px;opacity:.75;cursor:pointer;text-decoration:underline}
/* cake */
#cake{width:min(92vw,430px);overflow:visible;filter:drop-shadow(0 18px 18px #0003)}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:fl .35s infinite alternate}
@keyframes fl{to{transform:scale(.85,1.12) rotate(4deg)}}
.cand{cursor:pointer}.cand.off .flame{display:none}
.hint{color:#fff;font-size:15px;margin-top:6px;min-height:22px;font-weight:700}
.win{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;background:#2b1b3de6;text-align:center;padding:20px}
.win.on{display:flex}
.win .age{font-size:clamp(120px,40vw,240px);font-weight:900;line-height:.9;color:var(--yel);text-shadow:0 8px 0 #c21f62;animation:pop .9s cubic-bezier(.2,1.7,.4,1) both}
@keyframes pop{from{transform:scale(.2) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
/* gifts */
.gifts{display:flex;gap:14px;margin-top:24px;flex-wrap:wrap;justify-content:center}
.gift{width:min(28vw,110px);aspect-ratio:1;font-size:clamp(46px,14vw,70px);background:#fff;border-radius:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 10px 0 #0002;animation:hop 1.6s infinite;position:relative}
.gift:nth-child(2){animation-delay:.25s}.gift:nth-child(3){animation-delay:.5s}
@keyframes hop{0%,60%,100%{transform:none}30%{transform:translateY(-14px) rotate(-5deg)}}
.gift.done{animation:none;opacity:.55}.gift.done:after{content:"✔";position:absolute;right:-6px;top:-8px;background:var(--teal);color:#fff;font-size:16px;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.modal{position:fixed;inset:0;z-index:30;background:#2b1b3d99;display:none;align-items:center;justify-content:center;padding:18px}
.modal.on{display:flex}
.pane{background:var(--cream);border-radius:26px;padding:24px 22px;width:min(94vw,470px);max-height:90vh;overflow-y:auto;animation:pop .6s cubic-bezier(.2,1.5,.4,1);text-align:left;position:relative}
.pane h2{font-size:26px;color:var(--pink);margin-bottom:10px}
.pane p{line-height:1.7;margin-bottom:10px;font-size:16.5px}
.pane .x{position:absolute;top:10px;right:14px;font-size:26px;cursor:pointer;opacity:.6}
.strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
.strip div{flex:0 0 78%;scroll-snap-align:center;background:#fff;padding:8px 8px 30px;border-radius:10px;box-shadow:0 6px 14px #0003;position:relative}
.strip img{width:100%;aspect-ratio:1/1.1;object-fit:cover;border-radius:6px;display:block}
.strip b{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:14px}
.ticket{border:3px dashed var(--pink);border-radius:18px;padding:18px;text-align:center;background:#fff}
.ticket .em{font-size:60px}.ticket h3{font-size:24px;color:var(--ink)}
/* chat */
.phone{width:min(94vw,430px);height:min(78vh,620px);background:#efe7dd;border-radius:28px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 50px #0005}
.ph-top{background:var(--teal);color:#fff;padding:12px 16px;display:flex;gap:10px;align-items:center;text-align:left}
.av{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--teal);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px}
.ph-top small{display:block;opacity:.85;font-size:12px}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.b{max-width:80%;padding:9px 13px;border-radius:16px;font-size:15.5px;line-height:1.4;text-align:left;animation:in .3s;box-shadow:0 1px 2px #0002}
.b.l{background:#fff;border-top-left-radius:4px;align-self:flex-start}.b.r{background:#d7ffc4;border-top-right-radius:4px;align-self:flex-end}
@keyframes in{from{transform:translateY(10px) scale(.9);opacity:0}}
.typing{align-self:flex-start;background:#fff;border-radius:16px;padding:10px 14px;letter-spacing:3px;animation:bl 1s infinite}
.replies{padding:10px;display:flex;gap:8px;flex-wrap:wrap;background:#f6f1ea;justify-content:center}
.replies button{border:2px solid var(--teal);background:#fff;color:var(--ink);border-radius:20px;padding:8px 14px;font-weight:700;cursor:pointer;font-family:inherit}
/* finale */
#t4{justify-content:flex-start;padding-top:28px}
.lvl{background:#fff;border-radius:24px;padding:18px 30px;box-shadow:0 10px 0 #0002;animation:pop .9s both}
.lvl small{letter-spacing:3px;color:var(--pink);font-weight:900}
.lvl h1{font-size:clamp(34px,10vw,56px)}
.bar{height:16px;background:#eee;border-radius:10px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--yel),var(--pink));animation:fill 2.4s .5s forwards}
@keyframes fill{to{width:100%}}
.ad{width:min(92vw,500px);background:var(--ink);color:#fff;border-radius:24px;padding:24px 22px;text-align:left;margin:22px 0 14px;position:relative;box-shadow:0 0 0 4px var(--yel),0 18px 40px #0005}
.ad .tag{position:absolute;top:-13px;left:20px;background:var(--yel);color:var(--ink);font-size:11px;font-weight:900;padding:4px 12px;border-radius:12px;letter-spacing:1.5px}
.ad h3{font-size:23px;color:var(--yel);margin:4px 0 8px}.ad p{line-height:1.6;font-size:15px;opacity:.92}
.ad ul{list-style:none;margin:10px 0 14px}.ad li{margin:5px 0;font-size:15px}
.ad a{display:inline-block;margin:4px 8px 0 0;padding:11px 20px;border-radius:22px;background:var(--pink);color:#fff;font-weight:900;text-decoration:none;font-size:14px}
.ad .by{font-size:12px;opacity:.55;margin-top:12px}
#credit{position:fixed;bottom:8px;left:12px;color:#fff;font-size:12px;opacity:.7;z-index:5;display:none}
</style>
</head>

<script>
const $=id=>document.getElementById(id),pretty=CONFIG.birthday[0]+CONFIG.birthday.slice(1).toLowerCase();
let photos=[...CONFIG.photos],audio,MG;
["n1","wn","n4"].forEach(i=>$(i).textContent=CONFIG.birthday);
$("ag1").textContent=CONFIG.age;$("wage").textContent=CONFIG.age;$("lv").textContent=CONFIG.age;
$("lvn").textContent="Adulting begins, "+pretty+"!";
$("nt").textContent=CONFIG.from+" sent you a surprise 🎉";
$("fromname").textContent=CONFIG.from;$("from4").textContent=CONFIG.from;$("credit").textContent="💻 Website by Zaid";
(function(){const a=CONFIG.ad,l=[];
  if(a.whatsapp)l.push(`<a href="https://wa.me/${a.whatsapp}?text=${encodeURIComponent("Hi Zaid, I saw the birthday website and I want one too!")}" target="_blank">💬 WhatsApp Zaid</a>`);

  if(a.email)l.push(`<a href="mailto:${a.email}">✉️ Email</a>`);
  $("ad").innerHTML=`<span class="tag">DEVELOPER AD</span><h3>${a.title}</h3><p>${a.text}</p><ul>${a.points.map(p=>`<li>${p}</li>`).join("")}</ul>${a.phone?`<div style="margin:2px 0 8px;font-weight:900;color:#ffd23f;font-size:17px">📞 ${a.phone}</div>`:""}${l.join("")||'<b style="color:#ffd23f">Message Zaid to order yours!</b>'}<div class="by">Designed &amp; developed by Zaid</div>`})();

// clock
function tick(){const d=new Date();$("clk").textContent=d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}).replace(/\s?[AP]M/i,"");$("dt").textContent=d.toLocaleDateString([],{weekday:"long",month:"long",day:"numeric"})}tick();setInterval(tick,20000);

// photos
function ph(i){const c=document.createElement("canvas");c.width=200;c.height=220;const x=c.getContext("2d"),h=[330,190,40,260][i%4];
  const g=x.createLinearGradient(0,0,200,220);g.addColorStop(0,`hsl(${h},85%,65%)`);g.addColorStop(1,`hsl(${h+50},75%,45%)`);x.fillStyle=g;x.fillRect(0,0,200,220);
  x.font="90px serif";x.textAlign="center";x.textBaseline="middle";x.fillText(["🏆","🎮","🚀","😎"][i%4],100,115);return c.toDataURL()}
const P=i=>photos.length?photos[i%photos.length]:ph(i);
$("files").onchange=e=>{photos=[...e.target.files].map(f=>URL.createObjectURL(f));document.querySelector(".pick").textContent="✅ "+photos.length+" photos added"};
$("files").onclick=e=>e.stopPropagation();

// stages
function show(n){document.querySelectorAll(".stage").forEach((s,i)=>s.classList.toggle("on",i==n));$("credit").style.display=n==4?"block":"none"}

// audio
function music(){try{const A=new (window.AudioContext||window.webkitAudioContext)();audio=A;
  const n={C:261.6,D:293.7,E:329.6,F:349.2,G:392,A:440,B:493.9,c:523.3,d:587.3,e:659.3,f:698.5,g:784};
  const song="G.5 G.5 A1 G1 c1 B2 G.5 G.5 A1 G1 d1 c2 G.5 G.5 g1 e1 c1 B1 A2 f.5 f.5 e1 c1 d1 c2".split(" ");
  const M=A.createGain();M.gain.value=1.6;MG=M;const K=A.createDynamicsCompressor();M.connect(K);K.connect(A.destination);let t=A.currentTime+.2;
  for(let r=0;r<6;r++)song.forEach(s=>{const d=parseFloat(s.slice(1))*.45,o=A.createOscillator(),g=A.createGain();o.type="triangle";o.frequency.value=n[s[0]];
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.55,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(M);o.start(t);o.stop(t+d+.05);t+=d})}catch(e){}}
function claps(){if(!audio)return;const A=audio,T=A.currentTime+.1,buf=A.createBuffer(1,A.sampleRate*.12,A.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);const out=A.createGain();out.gain.value=2.2;out.connect(A.destination);
  for(let i=0;i<110;i++){const t=T+Math.random()*5.5*(i<30?.5:1)+(i>=30?.3:0),s=A.createBufferSource();s.buffer=buf;s.playbackRate.value=.8+Math.random()*.6;
    const f=A.createBiquadFilter();f.type="bandpass";f.frequency.value=1200+Math.random()*1800;f.Q.value=.8;const g=A.createGain();g.gain.value=.5+Math.random()*.5;s.connect(f).connect(g).connect(out);s.start(t)}}
function speak(){claps();if(MG)MG.gain.value=.3;const done=()=>{if(MG)MG.gain.value=1.6};
  if(CONFIG.shoutAudio){const a=new Audio(CONFIG.shoutAudio);a.play().catch(()=>{});a.onended=done;return}
  try{speechSynthesis.cancel();setTimeout(()=>{const vs=speechSynthesis.getVoices(),v=vs.find(v=>/david|mark|google uk english male|male/i.test(v.name))||vs[0];
    for(let i=0;i<3;i++){const u=new SpeechSynthesisUtterance(i<2?"Happy Birthday "+pretty+"!":"Happy Birthday to you "+pretty+"!!");u.volume=1;u.rate=.95;u.pitch=1.3;if(v)u.voice=v;if(i==2)u.onend=done;speechSynthesis.speak(u)}},350)}catch(e){done()}
  setTimeout(done,9000)}

// ---- birthday date (date lock disabled) ----
const B=CONFIG.birthDate,now0=new Date();let target=new Date(now0.getFullYear(),B.month-1,B.day,B.hour,B.minute,0);
const dateTxt=target.toLocaleDateString([],{day:"numeric",month:"long"}),timeTxt=target.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
$("wdate").textContent="🎂 "+dateTxt;$("fdate").textContent="13 October • "+CONFIG.age+" years of awesome".replace("13 October",dateTxt);
$("fdate").textContent=dateTxt+" • "+CONFIG.age+" years of awesome";
let unlocked=!CONFIG.lockUntilBirthday||now0>=target;
function chk(){const d=target-new Date();
  if(d<=0||unlocked){if(!unlocked)unlocked=true;$("cd").textContent="🎉 It's "+pretty+"'s birthday! Tap to open";$("notif").classList.remove("lk");return}
  const D=Math.floor(d/864e5),H=Math.floor(d/36e5)%24,M=Math.floor(d/6e4)%60,S=Math.floor(d/1e3)%60;

let taps=0;$("clk").onclick=()=>{if(++taps>=5){unlocked=true;chk()}}; // secret: tap the clock 5 times to preview early

// ---- cake ----
let lit=0;
function buildCake(){const s=$("cake"),N=CONFIG.age;let h=`
<ellipse cx="200" cy="300" rx="190" ry="26" fill="#fff" opacity=".9"/><ellipse cx="200" cy="296" rx="170" ry="20" fill="#e9dff5"/>
<path d="M50 215v70c0 14 70 22 150 22s150-8 150-22v-70z" fill="#ff8fb8"/><ellipse cx="200" cy="215" rx="150" ry="26" fill="#ffc1d9"/>
<path d="M50 215c0 22 18 22 18 4s24-6 24 14 24 8 24-8 20-10 20 6 26 14 26-6 22-12 22 8 24 14 24 8 24-12 24 0 22 10 22-4 18 10 18-8 4-8 4-8" fill="#fff" opacity=".0"/>
<path d="M95 150v65c0 12 50 18 105 18s105-6 105-18v-65z" fill="#8e5cf5"/><ellipse cx="200" cy="150" rx="105" ry="20" fill="#b794ff"/>
<path d="M95 150c0 20 14 20 14 4s18-4 18 14 16 8 16-6 20-8 20 8 20 14 20-4 18-12 16 8 18 14 18 4 18-14 14 2 14-2 0-10 0-10l0-6z" fill="#fff"/>`;
  const pts=[];for(let i=0;i<N;i++){const outer=i<Math.ceil(N*.62),idx=outer?i:i-Math.ceil(N*.62),cnt=outer?Math.ceil(N*.62):N-Math.ceil(N*.62),a=idx/cnt*Math.PI*2+(outer?0:.3),rx=outer?80:40,ry=outer?13:6;
    pts.push({x:200+Math.cos(a)*rx,y:148+Math.sin(a)*ry})}
  pts.sort((a,b)=>a.y-b.y).forEach((p,i)=>{const c=["#ffd23f","#19c3b1","#ff4d8d","#fff"][i%4];
    h+=`<g class="cand" data-i="${i}"><rect x="${p.x-3}" y="${p.y-26}" width="6" height="28" rx="2" fill="${c}"/><rect x="${p.x-3}" y="${p.y-18}" width="6" height="4" fill="#0002"/><g class="flame"><ellipse cx="${p.x}" cy="${p.y-35}" rx="4.5" ry="8" fill="#ffb300"/><ellipse cx="${p.x}" cy="${p.y-33}" rx="2.2" ry="4.5" fill="#fff6b0"/></g><rect x="${p.x-12}" y="${p.y-46}" width="24" height="50" fill="transparent"/></g>`});
  s.innerHTML=h;lit=N;s.querySelectorAll(".cand").forEach(c=>c.onclick=()=>out(c))}
function out(c){if(c.classList.contains("off"))return;c.classList.add("off");if(--lit<=0)setTimeout(celebrate,500)}
function blowAll(){const cs=[...document.querySelectorAll(".cand:not(.off)")];cs.forEach((c,i)=>setTimeout(()=>out(c),i*70))}
$("blowbtn").onclick=async()=>{const hint=$("hint");hint.textContent="🎤 Listening... blow now!";
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),A=new (window.AudioContext||window.webkitAudioContext)(),an=A.createAnalyser();an.fftSize=512;A.createMediaStreamSource(st).connect(an);
    const d=new Uint8Array(an.fftSize);let hits=0,t0=Date.now();
    const iv=setInterval(()=>{an.getByteTimeDomainData(d);let m=0;for(const v of d)m=Math.max(m,Math.abs(v-128));
      hits=m>70?hits+1:Math.max(0,hits-1);
      if(hits>5){clearInterval(iv);st.getTracks().forEach(t=>t.stop());A.close();blowAll()}
      else if(Date.now()-t0>9000){clearInterval(iv);st.getTracks().forEach(t=>t.stop());A.close();hint.textContent="Couldn't hear you 😄 Tap the candles!"}},60)
  }catch(e){hint.textContent="";blowAll()}};

function celebrate(){$("win").classList.add("on");speak();fireworks()}
$("wnext").onclick=()=>{$("win").classList.remove("on");show(2)};

// ---- gifts ----
const opened=new Set();
document.querySelectorAll(".gift").forEach(g=>g.onclick=()=>{const k=+g.dataset.g;opened.add(k);g.classList.add("done");
  let h="";
  if(k==0)h=`<h2>📸 Memories</h2><p>Swipe through ➜</p><div class="strip">${[0,1,2,3].map(i=>`<div><img src="${P(i)}"><b>${CONFIG.captions[i%CONFIG.captions.length]}</b></div>`).join("")}</div>`;
  if(k==1)h=`<h2>💌 A letter for you</h2><p><b>Dear ${pretty},</b></p>${CONFIG.letter.map(m=>`<p>${m}</p>`).join("")}<p style="text-align:right;font-weight:900;color:#ff4d8d">— ${CONFIG.from}</p>`;
  if(k==2)h=`<h2>🎟️ Your voucher</h2><div class="ticket"><div class="em">🍕</div><h3>${CONFIG.voucher}</h3><p style="margin:8px 0 0">Valid on your birthday. Show this screen to claim 😎</p></div>`;
  $("pane").innerHTML=`<span class="x" onclick="closeM()">✕</span>`+h;$("modal").classList.add("on");fireworks(true)});
function closeM(){$("modal").classList.remove("on");if(opened.size==3)$("gnext").classList.remove("hide")}
$("modal").onclick=e=>{if(e.target.id=="modal")closeM()};
$("gnext").onclick=()=>{show(3);runChat()};

// ---- chat ----
function runChat(){const c=$("chat");c.innerHTML="";let i=0;$("online").textContent="typing...";
  (function next(){if(i>=CONFIG.chat.length){$("online").textContent="online";$("replies").classList.remove("hide");return}
    const ty=document.createElement("div");ty.className="typing";ty.textContent="● ● ●";c.appendChild(ty);c.scrollTop=1e5;
    setTimeout(()=>{ty.remove();const b=document.createElement("div");b.className="b l";b.textContent=CONFIG.chat[i++];c.appendChild(b);c.scrollTop=1e5;setTimeout(next,500)},1100)})()}
$("replies").querySelectorAll("button").forEach(b=>b.onclick=()=>{const c=$("chat"),m=document.createElement("div");m.className="b r";m.textContent=b.textContent;c.appendChild(m);$("replies").classList.add("hide");c.scrollTop=1e5;
  setTimeout(()=>{const r=document.createElement("div");r.className="b l";r.textContent="Love you bro, enjoy! 🥳💙";c.appendChild(r);c.scrollTop=1e5;$("cnext").classList.remove("hide")},900)});
$("cnext").onclick=()=>{show(4);fireworks();setTimeout(fireworks,3000)};

// ---- fireworks / confetti ----
const fx=$("fx"),X=fx.getContext("2d");let parts=[],run=false;
function rs(){fx.width=innerWidth;fx.height=innerHeight}rs();addEventListener("resize",rs);
function burst(x,y){const h=Math.random()*360;for(let i=0;i<60;i++){const a=Math.PI*2*i/60,v=2+Math.random()*4;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,h})}}
function fireworks(soft){let n=0;const iv=setInterval(()=>{burst(fx.width*(.15+Math.random()*.7),fx.height*(.12+Math.random()*.4));if(++n>(soft?2:12))clearInterval(iv)},soft?400:450);
  for(let i=0;i<(soft?50:130);i++)parts.push({x:Math.random()*fx.width,y:-Math.random()*300,vx:Math.random()*2-1,vy:2+Math.random()*3,l:2.5,h:Math.random()*360,c:1});
  if(!run){run=true;loop()}}
function loop(){X.clearRect(0,0,fx.width,fx.height);parts=parts.filter(p=>p.l>0);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.c){p.l-=.004;X.fillStyle=`hsl(${p.h},95%,60%)`;X.fillRect(p.x,p.y,6,9)}else{p.vy+=.05;p.l-=.014;X.globalAlpha=Math.max(p.l,0);X.fillStyle=`hsl(${p.h},100%,65%)`;X.beginPath();X.arc(p.x,p.y,2.6,0,7);X.fill();X.globalAlpha=1}});
  if(parts.length)requestAnimationFrame(loop);else run=false}
</script>
