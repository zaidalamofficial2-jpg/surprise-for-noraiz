<style>
/* ZA CMA Learning Hub - midnight indigo brand system */
:root {
  --bg: #f5f6fc; --surface: #ffffff; --surface-2: #f0f1fa; --line: #e3e5f1; --ink: #171a35; --muted: #626985;
  --primary: #5967d8; --primary-ink: #ffffff; --primary-soft: #eceeff; --gold: #e9bd68;
  --ok: #138a5b; --ok-soft: #e1f6ec; --bad: #cf3a3a; --bad-soft: #fde8e8; --warn: #b7791f; --warn-soft: #fff4dc;
  --side: #171a3b; --side-ink: #d4d8f2; --side-active: rgba(255,255,255,.1);
  --shadow: 0 1px 2px rgba(15,27,61,.06), 0 8px 24px rgba(15,27,61,.06);
  --radius: 16px; --radius-sm: 10px;
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
}
[data-theme="dark"] {
  --bg: #0c111b; --surface: #151c2a; --surface-2: #1b2333; --line: #263046; --ink: #e8ecf6; --muted: #93a0bd;
  --primary: #aab2ff; --primary-ink: #171a3b; --primary-soft: #292e59;
  --ok: #3ccf91; --ok-soft: #12332a; --bad: #ff7a7a; --bad-soft: #3a1b1f; --warn: #f0b858; --warn-soft: #3a2f16;
  --side: #0d1028; --side-ink: #c2c8ed; --side-active: rgba(255,255,255,.08);
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.25);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font: 15px/1.55 var(--font); color: var(--ink); background: var(--bg); transition: background .25s, color .25s; }
h1, h2, h3, h4 { margin: 0 0 .4em; line-height: 1.2; letter-spacing: -.01em; }
h1, h2 { font-family: var(--display); font-weight: 700; }
h1 { font-size: clamp(1.6rem, 2.2vw + 1rem, 2.25rem); }
h2 { font-size: 1.35rem; } h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0 0 .8em; }
a { color: var(--primary); }
button, input, select, textarea { font: inherit; color: inherit; }
svg { display: block; flex: none; }
.ic { width: 1.15em; height: 1.15em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 6px; }
.muted { color: var(--muted); } .sm-t { font-size: .85rem; } .center { text-align: center; }
.row { display: flex; gap: .75rem; align-items: center; } .row.wrap { flex-wrap: wrap; } .between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; } .gap-s { gap: .4rem; } .mt { margin-top: 1rem; } .mt-s { margin-top: .5rem; } .mb { margin-bottom: 1rem; }
.hide { display: none !important; }

/* layout */
.app { display: grid; grid-template-columns: 264px 1fr; min-height: 100vh; }
.sidebar { background: var(--side); color: var(--side-ink); padding: 1.1rem .9rem; display: flex; flex-direction: column; gap: 1.2rem; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; gap: .7rem; align-items: center; text-decoration: none; color: #fff; padding: .2rem .5rem; }
.brand b { font-family: var(--display); font-size: 1.25rem; letter-spacing: .04em; display: block; line-height: 1; }
.brand small { color: var(--side-ink); font-size: .75rem; }
.brand-mark { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(145deg, #7785ff, #303b91); border: 1px solid rgba(255,255,255,.18); display: grid; place-items: center; position: relative; color: #fff; font-size: .92rem; font-weight: 800; letter-spacing: -.05em; box-shadow: 0 5px 16px rgba(0,0,0,.18); }
.brand-mark::after { content: "✦"; position: absolute; top: 3px; right: 5px; color: #f1cf83; font-size: .48rem; }
#nav { display: flex; flex-direction: column; gap: .15rem; }
.nav-sec { font-size: .68rem; text-transform: uppercase; letter-spacing: .12em; color: #7886ad; padding: .8rem .7rem .3rem; }
.nav-link { display: flex; align-items: center; gap: .7rem; padding: .6rem .7rem; border-radius: 10px; color: var(--side-ink); text-decoration: none; font-weight: 500; transition: background .15s, color .15s; }
.nav-link:hover { background: var(--side-active); color: #fff; }
.nav-link.active { background: var(--side-active); color: #fff; box-shadow: inset 3px 0 0 var(--gold); }
.nav-dot { width: 9px; height: 9px; border-radius: 50%; margin-left: auto; }
.side-foot { margin-top: auto; display: grid; gap: .6rem; }
.ai-pill { display: flex; align-items: center; gap: .5rem; font-size: .8rem; padding: .5rem .7rem; border-radius: 10px; background: rgba(255,255,255,.06); }
.ai-pill i { width: 8px; height: 8px; border-radius: 50%; background: #999; flex: none; }
.ai-pill.ok i { background: #3ccf91; box-shadow: 0 0 0 3px rgba(60,207,145,.25); } .ai-pill.off i { background: #ff7a7a; }
.main { min-width: 0; }
.topbar { display: none; }
main#view { padding: clamp(1rem, 2.4vw, 2rem); max-width: 1280px; margin: 0 auto; animation: fade .25s ease; outline: none; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.scrim { display: none; }

/* components */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.15rem; box-shadow: var(--shadow); }
.card.flat { box-shadow: none; } .card.pad-0 { padding: 0; overflow: hidden; }
.card h3 { margin-bottom: .6rem; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; border: 1px solid transparent; background: var(--primary); color: var(--primary-ink); font-weight: 600; padding: .62rem 1.05rem; border-radius: 11px; cursor: pointer; transition: transform .1s, filter .15s, background .15s; text-decoration: none; line-height: 1.2; }
.btn:hover { filter: brightness(1.08); } .btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; filter: none; }
.btn.ghost { background: transparent; color: inherit; border-color: var(--line); } .sidebar .btn.ghost { color: var(--side-ink); border-color: rgba(255,255,255,.14); }
.btn.soft { background: var(--primary-soft); color: var(--primary); } .btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.gold { background: var(--gold); color: #1b1404; } .btn.sm { padding: .4rem .7rem; font-size: .85rem; border-radius: 9px; } .btn.lg { padding: .85rem 1.4rem; font-size: 1rem; } .btn.full { width: 100%; }
.icon-btn { width: 40px; height: 40px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; color: var(--ink); flex: none; }
.icon-btn:hover { background: var(--surface-2); } .icon-btn.on { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.icon-btn.rec { background: var(--bad); color: #fff; border-color: var(--bad); animation: pulse 1.2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(207,58,58,.5); } 100% { box-shadow: 0 0 0 14px rgba(207,58,58,0); } }
.chip { display: inline-flex; align-items: center; gap: .35rem; padding: .18rem .6rem; border-radius: 99px; font-size: .75rem; font-weight: 600; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; } .chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; } .chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
button.chip { cursor: pointer; } button.chip:hover, .chip.sel { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }
label.f { display: grid; gap: .3rem; font-size: .82rem; font-weight: 600; color: var(--muted); }
input[type=text], input[type=number], input[type=date], input[type=search], input[type=password], select, textarea { width: 100%; padding: .6rem .75rem; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; color: var(--ink); }
textarea { resize: vertical; min-height: 90px; } input:focus, select:focus, textarea:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px var(--primary-soft); }
.grid { display: grid; gap: 1rem; } .g2 { grid-template-columns: repeat(2, 1fr); } .g3 { grid-template-columns: repeat(3, 1fr); } .g4 { grid-template-columns: repeat(4, 1fr); } .g5 { grid-template-columns: repeat(5, 1fr); }
.g-auto { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.2rem; }
.page-head p { margin: 0; color: var(--muted); }
.tabs { display: flex; gap: .3rem; background: var(--surface-2); padding: .25rem; border-radius: 12px; overflow-x: auto; width: fit-content; max-width: 100%; }
.tab { border: 0; background: transparent; padding: .5rem .9rem; border-radius: 9px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tab.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.banner { display: flex; gap: .8rem; padding: .9rem 1rem; border-radius: 12px; background: var(--warn-soft); color: var(--warn); border: 1px solid transparent; margin-bottom: 1rem; align-items: flex-start; }
.banner.bad { background: var(--bad-soft); color: var(--bad); } .banner b { display: block; }
.banner code { background: rgba(0,0,0,.08); padding: .05rem .35rem; border-radius: 5px; }
.empty { text-align: center; padding: 2rem 1rem; color: var(--muted); } .empty .ic { width: 2.2rem; height: 2.2rem; margin: 0 auto .6rem; opacity: .6; }
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; } .bar > i { display: block; height: 100%; border-radius: 99px; background: var(--primary); transition: width .6s cubic-bezier(.2,.8,.2,1); }
.stat { display: grid; gap: .15rem; } .stat .v { font-family: var(--display); font-size: 1.9rem; font-weight: 700; line-height: 1.1; } .stat .l { color: var(--muted); font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.stat .ic-badge { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); margin-bottom: .4rem; }
.ring { position: relative; width: var(--s, 120px); height: var(--s, 120px); flex: none; } .ring svg { transform: rotate(-90deg); width: 100%; height: 100%; }
.ring .t { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: calc(var(--s, 120px) * .24); }
.ring circle { fill: none; stroke-width: 10; } .ring .bg { stroke: var(--surface-2); } .ring .fg { stroke: var(--c, var(--primary)); stroke-linecap: round; transition: stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1); }
.list { display: grid; } .list > * { padding: .7rem 0; border-bottom: 1px solid var(--line); } .list > *:last-child { border-bottom: 0; }
.avatar { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; color: #fff; background: var(--c, var(--primary)); font-weight: 700; flex: none; }
.avatar .ic { width: 22px; height: 22px; }

/* hero + subject cards */
.hero { background: linear-gradient(120deg, #0f1b3d 0%, #24389a 60%, #3b56d6 100%); color: #fff; border-radius: 22px; padding: clamp(1.2rem, 3vw, 2rem); display: flex; gap: 1.5rem; justify-content: space-between; align-items: center; flex-wrap: wrap; position: relative; overflow: hidden; margin-bottom: 1.2rem; }
.hero::after { content: ""; position: absolute; right: -60px; top: -80px; width: 280px; height: 280px; border-radius: 50%; background: radial-gradient(circle, rgba(232,176,74,.35), transparent 65%); pointer-events: none; }
.hero h1 { color: #fff; margin-bottom: .3rem; } .hero p { color: #cfd7f5; margin: 0 0 1rem; max-width: 52ch; }
.hero .ring { --s: 124px; z-index: 1; } .hero .ring .bg { stroke: rgba(255,255,255,.18); } .hero .ring .fg { stroke: var(--gold); } .hero .ring .t { color: #fff; }
.subj-card { position: relative; display: grid; gap: .8rem; text-decoration: none; color: inherit; transition: transform .2s, box-shadow .2s; overflow: hidden; }
.subj-card:hover { transform: translateY(-3px); box-shadow: 0 14px 34px rgba(15,27,61,.14); }
.subj-card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 5px; background: var(--c); }
.subj-card h3 { margin: 0; font-size: 1.1rem; } .subj-meta { display: flex; gap: .4rem; flex-wrap: wrap; }
.act-item { display: flex; gap: .7rem; align-items: flex-start; } .act-dot { width: 32px; height: 32px; border-radius: 10px; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; flex: none; }

/* classroom */
.class-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 1rem; align-items: start; }
.chat-card { display: flex; flex-direction: column; height: calc(100vh - 7.5rem); min-height: 520px; padding: 0; overflow: hidden; }
.chat-head { padding: .8rem 1rem; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: .7rem; flex-wrap: wrap; }
.chat-tools { display: flex; gap: .4rem; margin-left: auto; align-items: center; flex-wrap: wrap; }
.docbar { padding: .5rem 1rem; border-bottom: 1px solid var(--line); background: var(--surface-2); display: flex; gap: .6rem; align-items: center; font-size: .85rem; }
.docbar select { padding: .3rem .5rem; width: auto; max-width: 100%; flex: 1; }
.msgs { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: .9rem; scroll-behavior: smooth; }
.msg { max-width: 88%; display: grid; gap: .35rem; } .msg.user { align-self: flex-end; } .msg.user .bubble { background: var(--primary); color: var(--primary-ink); border-radius: 16px 16px 4px 16px; white-space: pre-wrap; }
.bubble { background: var(--surface-2); padding: .75rem 1rem; border-radius: 16px 16px 16px 4px; overflow-wrap: anywhere; }
.msg-image { display: block; width: auto; max-width: min(260px, 100%); max-height: 230px; object-fit: contain; border-radius: 10px; margin: 0 0 .55rem; border: 1px solid rgba(255,255,255,.22); }
.image-preview { display: flex; align-items: center; gap: .7rem; padding: .65rem .85rem; border-top: 1px solid var(--line); background: var(--surface-2); min-width: 0; }
.image-preview img { width: 58px; height: 58px; object-fit: cover; border-radius: 9px; border: 1px solid var(--line); flex: none; }
.image-preview-copy { display: grid; min-width: 0; gap: .12rem; font-size: .8rem; }
.image-preview-copy b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.image-preview-copy small { color: var(--muted); }
.composer textarea { flex: 1; min-width: 0; width: auto; }
.msg.err .bubble { background: var(--bad-soft); color: var(--bad); }
.msg-actions { display: flex; gap: .25rem; opacity: .75; } .msg-actions .icon-btn { width: 30px; height: 30px; border-radius: 8px; }
.typing { display: inline-flex; gap: 4px; padding: .3rem 0; } .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; } .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }
.quick { padding: 0 1rem .6rem; display: flex; gap: .4rem; flex-wrap: wrap; }
.composer { border-top: 1px solid var(--line); padding: .7rem; display: flex; gap: .5rem; align-items: flex-end; }
.composer textarea { min-height: 44px; max-height: 140px; resize: none; padding-top: .65rem; }
.listen-bar { padding: .35rem 1rem; font-size: .82rem; background: var(--bad-soft); color: var(--bad); display: flex; align-items: center; gap: .5rem; }
.syllabus { max-height: calc(100vh - 7.5rem); overflow-y: auto; padding: 0; }
.syl-head { padding: 1rem 1rem .6rem; position: sticky; top: 0; background: var(--surface); z-index: 1; border-bottom: 1px solid var(--line); }
.topic { display: flex; gap: .6rem; align-items: flex-start; padding: .6rem 1rem; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .15s; }
.topic:hover { background: var(--surface-2); } .topic.sel { background: var(--primary-soft); }
.topic .ck { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line); display: grid; place-items: center; flex: none; cursor: pointer; background: var(--surface); color: transparent; margin-top: 2px; }
.topic .ck.done { background: var(--ok); border-color: var(--ok); color: #fff; } .topic .ck .ic { width: 14px; height: 14px; stroke-width: 3; }
.topic .tt { flex: 1; font-size: .88rem; line-height: 1.35; } .topic .tt.done { color: var(--muted); }
.topic-copy { flex:1; min-width:0; display:grid; gap:.3rem; }
.topic-outline { color:var(--muted); font-size:.75rem; line-height:1.45; }
.topic-outline summary { cursor:pointer; width:max-content; max-width:100%; color:var(--primary); font-weight:600; }
.topic-outline ul { margin:.35rem 0 .1rem; padding-left:1.15rem; }
.topic-outline li { margin:.2rem 0; }
.subtopic-pick-wrap { grid-column:1/-1; border:1px solid var(--line); border-radius:12px; padding:.85rem; background:var(--surface-2); }
.subtopic-pick-head { display:flex; align-items:center; justify-content:space-between; gap:.7rem; flex-wrap:wrap; margin-bottom:.65rem; }
.subtopic-pick-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.5rem; max-height:320px; overflow:auto; padding:2px; }
.subtopic-option { display:flex; align-items:flex-start; gap:.55rem; border:1px solid var(--line); border-radius:10px; padding:.55rem .65rem; background:var(--surface); font-size:.82rem; font-weight:500; color:var(--ink); line-height:1.4; }
.subtopic-option input { width:17px; height:17px; margin:2px 0 0; flex:none; accent-color:var(--primary); }
.scheme-chapters { display:grid; gap:.5rem; margin-top:.8rem; }
.scheme-chapter { border:1px solid var(--line); border-radius:11px; padding:.75rem .85rem; background:var(--surface-2); }
.scheme-chapter summary { display:flex; justify-content:space-between; align-items:flex-start; gap:.7rem; cursor:pointer; font-weight:650; }
.scheme-chapter ul { margin:.6rem 0 .1rem; padding-left:1.25rem; }
.scheme-chapter li { margin:.28rem 0; color:var(--muted); font-size:.88rem; }
.scheme-pdf-actions { display:flex; flex-wrap:wrap; gap:.5rem; }
@media(max-width:700px) { .subtopic-pick-list { grid-template-columns:1fr; } .scheme-pdf-actions { width:100%; } .scheme-pdf-actions .btn { flex:1; } }
.chapter-mcq { width:28px; height:28px; border-radius:8px; color:var(--primary); flex:none; }
.class-tabs { display: none; margin-bottom: .8rem; }

/* markdown */
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md h1, .md h2, .md h3, .md h4 { font-family: var(--font); font-size: 1.02rem; margin: .9em 0 .35em; } .md h1 { font-size: 1.15rem; }
.md p { margin: 0 0 .65em; } .md ul, .md ol { margin: 0 0 .7em; padding-left: 1.3rem; } .md li { margin: .15em 0; }
.md code { background: rgba(127,127,127,.18); padding: .08em .35em; border-radius: 5px; font-size: .88em; }
.md pre { background: #0f1b3d; color: #e6ecff; padding: .8rem 1rem; border-radius: 10px; overflow-x: auto; margin: .5em 0 .8em; } .md pre code { background: none; padding: 0; color: inherit; }
.md blockquote { border-left: 3px solid var(--gold); margin: .5em 0; padding: .2em .9em; color: var(--muted); background: var(--surface); border-radius: 0 8px 8px 0; }
.md .tbl { overflow-x: auto; margin: .5em 0 .9em; } .md table { border-collapse: collapse; font-size: .88rem; min-width: 60%; } .md th, .md td { border: 1px solid var(--line); padding: .4rem .7rem; text-align: left; } .md th { background: var(--surface); }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 1em 0; }

/* practice / tests */

async function api(path, opts = {}) {

  const o = { method: opts.method || 'GET', headers: {} };
  if (opts.body !== undefined) { o.headers['content-type'] = 'application/json'; o.body = JSON.stringify(opts.body); }
  let res;
  try { res = await fetch(path, o); } catch { throw Object.assign(new Error('Cannot reach the server. Is it still running? (npm start)'), { code: 'OFFLINE' }); }
  let data = null; try { data = await res.json(); } catch { /* ignore */ }
  if (!res.ok) throw Object.assign(new Error(data?.error || `Request failed (${res.status})`), { code: data?.code, status: res.status });
  return data;
}

function modal(html, { onClose, wide, sticky } = {}) {
  const root = $('#modalRoot'); const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true" ${wide ? 'style="width:min(900px,100%)"' : ''}>${html}</div>`;
  const close = () => { bg.remove(); document.removeEventListener('keydown', esc_); onClose && onClose(); };
  const esc_ = e => { if (e.key === 'Escape' && !sticky) close(); };

}

/* ---------- markdown (safe: escapes first) ---------- */
function mdInline(s) {
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\*)/g, '$1<em>$2</em>');
  return s;
}
function splitRow(l) { return l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim()); }
function md(src) {
  const lines = String(src || '').replace(/\r/g, '').split('\n'); const out = []; let i = 0;
  const isBlockStart = l => /^(#{1,4}\s|```|>\s?|\s*[-*+]\s+|\s*\d+[.)]\s+|-{3,}\s*$|\s*\|.*\|\s*$)/.test(l);
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) { const code = []; i++; while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]); i++; out.push(`<pre><code>${esc(code.join('\n'))}</code></pre>`); continue; }
    if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(lines[i + 1])) {
      const head = splitRow(l); i += 2; const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(splitRow(lines[i++]));
      out.push(`<div class="tbl"><table><thead><tr>${head.map(c => `<th>${mdInline(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${mdInline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`); continue;
    }
    let m;
    if ((m = /^(#{1,4})\s+(.*)$/.exec(l))) { const n = Math.min(4, m[1].length + 1); out.push(`<h${n}>${mdInline(m[2])}</h${n}>`); i++; continue; }
    if (/^-{3,}\s*$/.test(l)) { out.push('<hr>'); i++; continue; }
    if (/^>\s?/.test(l)) { const q = []; while (i < lines.length && /^>\s?/.test(lines[i])) q.push(lines[i++].replace(/^>\s?/, '')); out.push(`<blockquote>${q.map(mdInline).join('<br>')}</blockquote>`); continue; }
    if (/^\s*[-*+]\s+/.test(l) || /^\s*\d+[.)]\s+/.test(l)) {
      const ordered = /^\s*\d+[.)]\s+/.test(l); const items = [];
      while (i < lines.length && (/^\s*[-*+]\s+/.test(lines[i]) || /^\s*\d+[.)]\s+/.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))) {
        if (/^\s{2,}\S/.test(lines[i]) && !/^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) items[items.length - 1] += ' ' + lines[i].trim();
        else items.push(lines[i].replace(/^\s*([-*+]|\d+[.)])\s+/, ''));
        i++;
      }
      out.push(`<${ordered ? 'ol' : 'ul'}>${items.map(t => `<li>${mdInline(t)}</li>`).join('')}</${ordered ? 'ol' : 'ul'}>`); continue;
    }
    if (!l.trim()) { i++; continue; }
    const p = [l]; i++;
    while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) p.push(lines[i++]);
    out.push(`<p>${p.map(mdInline).join('<br>')}</p>`);
  }
  return `<div class="md">${out.join('')}</div>`;
}
function plainText(src) {
  return String(src || '').replace(/```[\s\S]*?```/g, ' (code example omitted) ').replace(/^\s*\|?\s*:?-{2,}[-:| ]*$/gm, '').replace(/\|/g, ', ')
    .replace(/^#{1,6}\s*/gm, '').replace(/\*\*([^*]+)\*\*/g, '$1').replace(/\*([^*]+)\*/g, '$1').replace(/`([^`]+)`/g, '$1').replace(/^\s*[-*+]\s+/gm, '').replace(/^>\s?/gm, '').replace(/\n{2,}/g, '. ').replace(/\n/g, ' ').replace(/\s{2,}/g, ' ').trim();
}

/* ---------- charts (inline SVG, no libraries) ---------- */
function barChart(items, { unit = '', h = 150, color } = {}) {
  const W = 560, pad = { l: 34, r: 8, t: 10, b: 24 }; const max = Math.max(1, ...items.map(i => i.v));
  const bw = (W - pad.l - pad.r) / items.length;
  const ticks = [0, .5, 1].map(t => ({ y: pad.t + (h - pad.t - pad.b) * (1 - t), v: Math.round(max * t) }));
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img" aria-label="Bar chart">${ticks.map(t => `<line class="grid-l" x1="${pad.l}" x2="${W - pad.r}" y1="${t.y}" y2="${t.y}"/><text x="${pad.l - 6}" y="${t.y + 4}" text-anchor="end">${t.v}${unit}</text>`).join('')}${items.map((it, i) => {
    const bh = (h - pad.t - pad.b) * (it.v / max); const x = pad.l + i * bw + bw * .18;
    return `<rect class="bar-r" ${color ? `style="fill:${color}"` : ''} x="${x}" y="${h - pad.b - bh}" width="${bw * .64}" height="${Math.max(it.v ? 2 : 0, bh)}" rx="4"><title>${esc(it.label)}: ${it.v}${unit}</title></rect>${i % 2 === (items.length % 2 ? 0 : 1) || items.length <= 8 ? `<text x="${x + bw * .32}" y="${h - 7}" text-anchor="middle">${esc(it.label)}</text>` : ''}`;
  }).join('')}</svg>`;
}
function lineChart(series, { h = 170, labels = [] } = {}) {
  const W = 560, pad = { l: 34, r: 12, t: 10, b: 24 }; const n = Math.max(...series.map(s => s.points.length), 2);
  const X = i => pad.l + (W - pad.l - pad.r) * (n === 1 ? .5 : i / (n - 1)); const Y = v => pad.t + (h - pad.t - pad.b) * (1 - v / 100);
  let g = [0, 50, 100].map(t => `<line class="grid-l" x1="${pad.l}" x2="${W - pad.r}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${pad.l - 6}" y="${Y(t) + 4}" text-anchor="end">${t}%</text>`).join('');
  series.forEach(s => {
    const pts = s.points.map((v, i) => v === null || v === undefined ? null : [X(i), Y(v), v]).filter(Boolean);
    if (!pts.length) return;
    g += `<path class="ln" style="stroke:${s.color}" d="${pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ')}"/>` + pts.map(p => `<circle class="dot" style="stroke:${s.color}" cx="${p[0]}" cy="${p[1]}" r="4"><title>${esc(s.name)}: ${p[2]}%</title></circle>`).join('');
  });
  const lbl = labels.map((l, i) => (labels.length <= 8 || i % 2 === 0) ? `<text x="${X(i)}" y="${h - 7}" text-anchor="middle">${esc(l)}</text>` : '').join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img" aria-label="Line chart">${g}${lbl}</svg>`;
}
function ring(pct, { size = 120, color } = {}) {
  const r = 45, c = 2 * Math.PI * r; const off = c * (1 - Math.max(0, Math.min(100, pct)) / 100);
  return `<div class="ring" style="--s:${size}px;${color ? `--c:${color}` : ''}"><svg viewBox="0 0 110 110"><circle class="bg" cx="55" cy="55" r="${r}"/><circle class="fg" cx="55" cy="55" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg><div class="t">${Math.round(pct)}%</div></div>`;
}

      onEnd: got => { paintTools(); if (got && inp.value.trim()) send(); else if (rt.talk && document.body.contains(el) && !got) { rt.talk = false; paintTools(); toast('Talk mode paused — I did not hear anything.'); } },
      onError: () => { rt.talk = false; paintTools(); }
    });
    paintTools(); return ok;
  }

  sendBtn.onclick = () => send();
  inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
  inp.addEventListener('input', () => { inp.style.height = 'auto'; inp.style.height = Math.min(140, inp.scrollHeight) + 'px'; });
  micBtn.onclick = startListen;
  $('#stopBtn', el).onclick = () => { Voice.stop(); rt.talk = false; rt.speakingIdx = -1; paintTools(); };
  $('#autoBtn', el).onclick = () => { rt.autoSpeak = !rt.autoSpeak; try { localStorage.setItem('autoSpeak', rt.autoSpeak ? '1' : '0'); } catch { /* ignore */ } if (!rt.autoSpeak) Voice.stop(); paintTools(); toast(rt.autoSpeak ? 'Answers will be read aloud automatically.' : 'Auto read-aloud off.'); };
  $('#talkBtn', el).onclick = () => {
    if (!Voice.supportsSTT || !Voice.supportsTTS) { toast('Talk mode needs a browser with speech support (Chrome or Edge).', 'err'); return; }
    rt.talk = !rt.talk; paintTools();
    if (rt.talk) { toast('Talk mode on: speak your question. I will answer aloud, then listen again.'); startListen(); } else { Voice.stopListening(); Voice.stop(); paintTools(); }
  };
  $('#langBtn', el).onclick = () => { Voice.sttLang = Voice.sttLang.startsWith('ur') ? 'en-IN' : 'ur-PK'; paintTools(); toast(Voice.sttLang.startsWith('ur') ? 'Microphone will listen for Urdu (اردو). Answers stay in Roman Urdu/English text.' : 'Microphone will listen for English (Pakistani/Indian accent).'); };
  $('#clearBtn', el).onclick = async () => { if (!(await confirmDialog('Clear this conversation with ' + sub.teacher + '?', 'Clear', true))) return; await api('/api/chat/' + id, { method: 'DELETE' }); hist.length = 0; welcome(); $('#quick', el).classList.remove('hide'); };
  $('#docSel', el).onchange = e => { rt.docId = e.target.value; if (rt.docId) toast('Teacher will use this document as the primary reference.'); };

  el.addEventListener('click', async e => {
    const q = e.target.closest('[data-q]'); if (q) { send(q.dataset.q); return; }
    const tab = e.target.closest('[data-pane]'); if (tab && tab.classList.contains('tab')) { cw.dataset.pane = tab.dataset.pane; $$('.class-tabs .tab', el).forEach(t => t.classList.toggle('active', t === tab)); return; }
    const hard = e.target.closest('[data-hard]');
    if (hard) { e.stopPropagation(); try { await api('/api/revision', { method: 'POST', body: { subject: id, text: hard.dataset.hard } }); toast('Saved to your revision list', 'ok'); } catch (er) { errToast(er); } return; }
    const chapterMcq = e.target.closest('[data-chapter-mcq]');
    if (chapterMcq) { e.stopPropagation(); S.presetPractice = { subject: id, topic: chapterMcq.dataset.chapterMcq }; navigate('#/practice'); return; }
    if (e.target.closest('.topic-outline')) return;
    const ck = e.target.closest('[data-ck]');
    if (ck) {
      e.stopPropagation(); const t = ck.dataset.ck; const nowDone = !ck.classList.contains('done');
      try { await api('/api/lessons', { method: 'POST', body: { subject: id, topic: t, done: nowDone } }); } catch (er) { errToast(er); return; }
      ck.classList.toggle('done', nowDone); ck.setAttribute('aria-checked', nowDone); ck.nextElementSibling.classList.toggle('done', nowDone); nowDone ? done.add(t) : done.delete(t);
      const pct = Math.round(100 * done.size / sub.topics.length); $('#sylPct', el).textContent = pct + '% done'; $('#sylBar', el).style.width = pct + '%'; toast(nowDone ? 'Topic marked as completed 🎉' : 'Topic unmarked', nowDone ? 'ok' : ''); return;
    }
    const top = e.target.closest('.topic');
    if (top) { rt.topic = top.dataset.t; $$('.topic', el).forEach(t => t.classList.toggle('sel', t === top)); cw.dataset.pane = 'chat'; $$('.class-tabs .tab', el).forEach(t => t.classList.toggle('active', t.dataset.pane === 'chat')); send(`Please teach me this topic step by step: "${rt.topic}". Start with the basics, give a practical example, then ask me one question to check my understanding.`); return; }
    const m = e.target.closest('.msg'); const act = e.target.closest('[data-act]'); const spk = e.target.closest('.spk');
    if (spk && m) { const i = +spk.dataset.i; if (Voice.speaking && rt.speakingIdx === i) { Voice.stop(); rt.speakingIdx = -1; } else { rt.speakingIdx = i; Voice.speak(m._text, { onend: () => { rt.speakingIdx = -1; paintTools(); } }); } paintTools(); return; }
    if (act && m) {
      if (act.dataset.act === 'copy') { try { await navigator.clipboard.writeText(m._text); toast('Copied', 'ok'); } catch { toast('Copy failed', 'err'); } }
      if (act.dataset.act === 'note') { const firstLine = plainText(m._text).slice(0, 60); try { await api('/api/notes', { method: 'POST', body: { subject: id, title: `${sub.teacher}: ${firstLine}`, body: m._text } }); toast('Saved to Notes', 'ok'); } catch (er) { errToast(er); } }
      if (act.dataset.act === 'rev') { const t = rt.topic || plainText(m._text).slice(0, 80); try { await api('/api/revision', { method: 'POST', body: { subject: id, text: t } }); toast('Added to revision list', 'ok'); } catch (er) { errToast(er); } }
    }
  });
  el.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-ck]')) { e.preventDefault(); e.target.click(); } });

  S.cleanup = () => { Voice.stop(true); Voice.stopListening(); Voice.onSpeakState = null; };
  // auto-start a lesson when arriving from "Continue Learning"
  if (S.autoLesson && S.autoLesson.subject === id) {
    const t = S.autoLesson.topic; S.autoLesson = null; rt.topic = t;
    const row = $$('.topic', el).find(x => x.dataset.t === t); if (row) row.classList.add('sel');
    if (S.status?.aiConfigured) send(`Please teach me this topic step by step: "${t}". Start with the basics, give a practical example, then ask me one question to check my understanding.`);
  }
  if (S.askDoc && S.askDoc.subject === id) { rt.docId = String(S.askDoc.id); $('#docSel', el).value = rt.docId; const nm = S.askDoc.name; S.askDoc = null; inp.placeholder = `Ask ${sub.teacher} about “${nm}”…`; inp.focus(); }
}, a => { const s = subjOf(S.arg); return s ? s.short : 'Classroom'; });

</script>
<script>
'use strict';
/* MCQ practice + daily tests */
const LETTERS = ['A', 'B', 'C', 'D'];

function subjectPicker(selected, id = 'subjPick') {
  const visible = stageSubjects();
  return `<div class="seg" id="${id}">${visible.map(s => `<button type="button" class="seg-item ${s.id === selected ? 'sel' : ''}" style="--c:${s.color}" data-s="${s.id}"><div class="avatar" style="--c:${s.color}">${icon(s.icon)}</div><div><b>${esc(s.short)}</b><div class="muted sm-t">${esc(s.teacher)}</div></div></button>`).join('')}</div><div class="muted sm-t mt-s">Showing ${esc(currentStageInfo().title)} only. ${appFeatureAllowed('curriculum') ? '<a href="#/curriculum">Explore other stages</a>.' : 'Free-plan access is fixed to this stage; Pro members can explore all stages.'}</div>`;
}
function bindSubjectPicker(root, id, onPick) {
  const box = $('#' + id, root);
  box.addEventListener('click', e => { const b = e.target.closest('[data-s]'); if (!b) return; $$('.seg-item', box).forEach(x => x.classList.toggle('sel', x === b)); onPick(b.dataset.s); });
}
function topicOptions(sid, blank) { const s = subjOf(sid); const chapters = s.chapters || s.topics.map(title => ({ title })); return `<option value="">${esc(blank)}</option>` + chapters.map(c => `<option value="${esc(c.title)}">${esc(c.title)}</option>`).join(''); }

/* ---------------- Practice ---------------- */
route('practice', async (el) => {
  if (S.pendingPractice) { const p = S.pendingPractice; S.pendingPractice = null; return runPractice(el, p.questions, p.meta); }
  const preset = S.presetPractice; S.presetPractice = null;
  const stats = await api('/api/questions/stats'); const progress = await api('/api/progress'); const usage = await api('/api/practice/usage');
  const visibleSubjects = stageSubjects();
  let subject = preset?.subject && stageKeyForSubject(subjOf(preset.subject)) === S.studyStage ? preset.subject : (visibleSubjects.some(s => s.id === S.lastSubject) ? S.lastSubject : visibleSubjects[0]?.id); let mode = preset?.topic ? 'topic' : 'topic';
  const bankCount = (s, t) => stats.filter(x => x.subject === s && (!t || x.topic === t)).reduce((a, x) => a + x.n, 0);

  let selectedSubtopics = [];
  let selectedSubtopicChapter = '';
  function paint() {
    const m = mode;
    const usedForSubject = Number(usage.used && usage.used[subject] || 0);
    const remainingForSubject = usage.pro ? 40 : Math.max(0, 40 - usedForSubject);
    const allowedCounts = [5, 10, 15, 20, 30, 40].filter(n => usage.pro || n <= remainingForSubject);
    if (!usage.pro && remainingForSubject > 0 && !allowedCounts.includes(remainingForSubject)) allowedCounts.push(remainingForSubject);
    const countOptions = allowedCounts.length ? allowedCounts.map(n => `<option value="${n}" ${n === Math.min(10, remainingForSubject || 10) ? 'selected' : ''}>${n}</option>`).join('') : '<option value="0">Limit reached</option>';
    const quotaText = usage.pro ? '<span class="chip ok">Pro · No MCQ cap</span>' : `<span class="chip">Free limit: ${usedForSubject}/40 unique MCQs used · ${remainingForSubject} remaining</span>`;
    el.innerHTML = `${setupBanner()}
      <div class="page-head"><div><h1>MCQ Practice</h1><p>Subject-wise, chapter-wise or random questions in ICMAP exam style, with instant feedback.</p></div></div>
      <div class="card mb"><div class="row between wrap"><h3>1. Choose subject</h3>${quotaText}</div>${subjectPicker(subject)}</div>
      <div class="card mb"><h3>2. Choose practice type</h3>
        <div class="tabs mb" id="modeTabs">${[['topic', 'Chapter-wise'], ['random', 'Random mix'], ['saved', 'Saved difficult'], ['wrong', 'Review mistakes']].map(([k, l]) => `<button class="tab ${m === k ? 'active' : ''}" data-m="${k}">${l}</button>`).join('')}</div>
        <div class="grid g3">
          ${m === 'topic' ? `<label class="f" style="grid-column:span 2">Syllabus chapter<select id="topicSel">${topicOptions(subject, 'Whole subject (all chapters)')}</select><div class="muted sm-t mt-s" id="chapterScope">Choose a chapter to see and select its official subtopics.</div></label><div id="subtopicPicker" class="subtopic-pick-wrap hide"></div>` : `<div class="muted" style="grid-column:span 2;align-self:center">${{ random: 'A random mix across the whole syllabus of this subject.', saved: 'Questions you starred as difficult.', wrong: 'Questions you answered incorrectly and not yet got right.' }[m]}</div>`}
          <label class="f">Number of questions<select id="countSel" ${!usage.pro && remainingForSubject === 0 ? 'disabled' : ''}>${countOptions}</select></label>
          ${(m === 'topic' || m === 'random') ? `<label class="f">Source<select id="srcSel"><option value="ai">New questions from AI teacher</option><option value="bank">My question bank (${bankCount(subject)} saved)</option></select></label><label class="f">Difficulty<select id="diffSel"><option value="">Mixed</option><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard (exam level)</option></select></label>` : ''}
        </div>
        <div class="row mt wrap"><button class="btn lg" id="startBtn" ${!usage.pro && remainingForSubject === 0 ? 'disabled' : ''}>${icon('play')} Start practice</button><span class="muted sm-t">${progress.subjects.find(s => s.id === subject).attempted} attempts recorded in this subject. ${usage.pro ? 'Pro access is active.' : 'The 40-question limit counts different questions, not repeat attempts.'}</span></div>
      </div>`;
    bindSubjectPicker(el, 'subjPick', s => { subject = s; selectedSubtopicChapter = ''; selectedSubtopics = []; rememberSubject(s); paint(); });
    $('#modeTabs', el).onclick = e => { const b = e.target.closest('[data-m]'); if (b) { mode = b.dataset.m; paint(); } };
    const ts = $('#topicSel', el);
    const updateChapterScope = () => {
      const chapter = (subjOf(subject).chapters || []).find(c => c.title === ts?.value);
      const box = $('#chapterScope', el);
      const picker = $('#subtopicPicker', el);
      if (box) box.innerHTML = chapter ? `<b>${chapter.subtopics.length} official syllabus subtopics.</b> Select the exact points you want MCQs from.` : 'Choose a chapter to see and select its official subtopics.';
      if (!picker) return;
      if (!chapter) { picker.classList.add('hide'); picker.innerHTML = ''; selectedSubtopicChapter = ''; selectedSubtopics = []; return; }
      if (selectedSubtopicChapter !== chapter.title) { selectedSubtopicChapter = chapter.title; selectedSubtopics = chapter.subtopics.slice(); }
      picker.classList.remove('hide');
      picker.innerHTML = `<div class="subtopic-pick-head"><div><b>Select syllabus subtopics</b><div class="muted sm-t" id="subtopicCount">${selectedSubtopics.length} of ${chapter.subtopics.length} selected</div></div><div class="row wrap gap-s"><button type="button" class="btn sm ghost" data-subtopic-action="all">Select all</button><button type="button" class="btn sm ghost" data-subtopic-action="none">Clear</button></div></div><div class="subtopic-pick-list">${chapter.subtopics.map(x => `<label class="subtopic-option"><input type="checkbox" data-subtopic value="${esc(x)}" ${selectedSubtopics.includes(x) ? 'checked' : ''}><span>${esc(x)}</span></label>`).join('')}</div><div class="muted sm-t mt-s">Only checked subtopics are sent to the AI teacher. For exact subtopic filtering, choose “New questions from AI teacher”; older saved questions may only be tagged by chapter.</div>`;
      picker.onchange = e => {
        const input = e.target.closest('[data-subtopic]'); if (!input) return;
        if (input.checked && !selectedSubtopics.includes(input.value)) selectedSubtopics.push(input.value);
        if (!input.checked) selectedSubtopics = selectedSubtopics.filter(x => x !== input.value);
        selectedSubtopics = chapter.subtopics.filter(x => selectedSubtopics.includes(x));
        const countBox = $('#subtopicCount', picker); if (countBox) countBox.textContent = `${selectedSubtopics.length} of ${chapter.subtopics.length} selected`;
      };
      picker.onclick = e => {
        const action = e.target.closest('[data-subtopic-action]')?.dataset.subtopicAction; if (!action) return;
        selectedSubtopics = action === 'all' ? chapter.subtopics.slice() : [];
        $$('[data-subtopic]', picker).forEach(input => { input.checked = selectedSubtopics.includes(input.value); });
        const countBox = $('#subtopicCount', picker); if (countBox) countBox.textContent = `${selectedSubtopics.length} of ${chapter.subtopics.length} selected`;
      };
    };
    if (ts && preset?.topic && preset.subject === subject) ts.value = preset.topic;
    if (ts) { ts.onchange = () => { selectedSubtopicChapter = ''; selectedSubtopics = []; updateChapterScope(); }; updateChapterScope(); }
    $('#startBtn', el).onclick = start;
  }
  async function start() {
    const count = +$('#countSel', el).value; const topic = $('#topicSel', el)?.value || ''; const src = $('#srcSel', el)?.value || 'bank'; const difficulty = $('#diffSel', el)?.value || '';
    if (!count) return toast('Your free 40-question limit for this subject has been reached.', 'err');
    if (!usage.pro && count > Math.max(0, 40 - Number(usage.used && usage.used[subject] || 0))) return toast('Choose a smaller session within your remaining free MCQs.', 'err');
    const chapter = topic ? (subjOf(subject).chapters || []).find(c => c.title === topic) : null;
    const chosenSubtopics = mode === 'topic' && chapter ? selectedSubtopics.slice() : [];
    const btn = $('#startBtn', el); btn.disabled = true;
    if (mode === 'topic' && chapter && !chosenSubtopics.length) { btn.disabled = false; return toast('Select at least one syllabus subtopic, or use “Select all”.', 'err'); }
    if (mode === 'topic' && chapter && src === 'bank' && chosenSubtopics.length < chapter.subtopics.length) { btn.disabled = false; return toast('Subtopic-level filtering is available for new AI questions. The older question bank is tagged by chapter; choose AI teacher for this selection.', 'err'); }
    try {
      let qs;
      if ((mode === 'topic' || mode === 'random') && src === 'ai') {
        el.innerHTML = loading(`${subjOf(subject).teacher} is preparing ${count} fresh question${count > 1 ? 's' : ''}… (10–30 seconds)`);
        qs = await api('/api/questions/generate', { method: 'POST', body: { subject, topic: mode === 'topic' ? topic : '', subtopics: chosenSubtopics, count, difficulty } });
      } else {
        const params = new URLSearchParams({ subject, limit: count, random: 1 });
        if (mode === 'topic' && topic) params.set('topic', topic); if (mode === 'topic' && chosenSubtopics.length && chapter && chosenSubtopics.length < chapter.subtopics.length) params.set('subtopics', JSON.stringify(chosenSubtopics)); if (mode === 'saved') params.set('saved', 1); if (mode === 'wrong') params.set('wrong', 1); if (mode === 'topic' || mode === 'random') params.set('unseen', 1);
        qs = await api('/api/questions?' + params);
        if (!qs.length) { toast(mode === 'saved' ? 'No saved questions yet. Star difficult questions while practising.' : mode === 'wrong' ? 'No mistakes to review. Well done!' : 'Your question bank is empty for this selection. Choose “New questions from AI teacher”.', 'err'); btn.disabled = false; return; }
        if (qs.length < count) toast(`Only ${qs.length} question(s) available for this selection.`);
      }
      runPractice(el, qs, { subject, topic: mode === 'topic' ? topic : '', mode });
    } catch (e) { errToast(e); paint(); }
  }
  paint();
}, 'MCQ Practice');

function runPractice(el, qs, meta) {
  const sub = subjOf(meta.subject); const st = { i: 0, res: [], answered: false };
  S.trackSubject = meta.subject;
  const onKey = e => {
    if (e.target.matches('input,textarea,select')) return;
    if (!st.answered && /^[1-4a-dA-D]$/.test(e.key)) { const n = /\d/.test(e.key) ? +e.key - 1 : e.key.toLowerCase().charCodeAt(0) - 97; const b = $$('.opt', el)[n]; b && b.click(); }
    else if (st.answered && e.key === 'Enter') $('#nextBtn', el)?.click();
  };
  document.addEventListener('keydown', onKey); S.cleanup = () => document.removeEventListener('keydown', onKey);

  function show() {
    const q = qs[st.i]; st.answered = false;
    el.innerHTML = `
      <div class="row between mb"><div><span class="chip" style="color:${sub.color}">${esc(sub.short)}</span> <span class="chip">${esc(q.topic)}</span> ${q.difficulty ? `<span class="chip">${esc(q.difficulty)}</span>` : ''}</div><button class="btn ghost sm" id="quitBtn">${icon('x')} End session</button></div>
      <div class="row mb"><div class="grow bar"><i style="width:${(st.i / qs.length) * 100}%;background:${sub.color}"></i></div><b class="sm-t">${st.i + 1} / ${qs.length}</b></div>
      <div class="card">${q.subtopic ? `<div class="muted sm-t mb">Syllabus focus: <b>${esc(q.subtopic)}</b></div>` : ''}<div class="qtext">${esc(q.question)}</div>
        <div class="grid" id="opts">${q.options.map((o, i) => `<button class="opt" data-i="${i}"><span class="k">${LETTERS[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
        <div id="fb"></div></div>
      <div class="muted sm-t mt-s">Tip: press 1–4 to answer, Enter for next.</div>`;
    $('#quitBtn', el).onclick = async () => { if (st.res.length === 0 || await confirmDialog('End this session now?', 'End session')) finish(); };
    $('#opts', el).onclick = async e => {
      const b = e.target.closest('.opt'); if (!b || st.answered) return; st.answered = true;
      const chosen = +b.dataset.i; $$('.opt', el).forEach(x => x.disabled = true);
      let r; try { r = await api('/api/attempts', { method: 'POST', body: { questionId: q.id, chosen, mode: meta.mode || 'practice' } }); } catch (er) { errToast(er); st.answered = false; $$('.opt', el).forEach(x => x.disabled = false); return; }
      $$('.opt', el).forEach((x, i) => { if (i === r.answer) x.classList.add('right'); else if (i === chosen) x.classList.add('wrong'); });
      st.res.push({ q, chosen, correct: r.correct, answer: r.answer, explanation: r.explanation });
      $('#fb', el).innerHTML = `<div class="explain ${r.correct ? 'ok' : 'bad'}"><div class="row"><b class="grow">${r.correct ? '✅ Correct!' : `❌ Incorrect — the right answer is ${LETTERS[r.answer]}`}</b><button class="btn sm ${q.saved ? 'gold' : 'ghost'}" id="saveQ">${icon('star')} <span>${q.saved ? 'Saved' : 'Save as difficult'}</span></button></div><div class="mt-s">${md(r.explanation)}</div></div>
        <div class="row mt" style="justify-content:flex-end"><button class="btn" id="nextBtn">${st.i + 1 < qs.length ? 'Next question' : 'See results'} ${icon('arrow')}</button></div>`;
      $('#saveQ', el).onclick = async ev => { const btn = ev.currentTarget; try { const s = await api(`/api/questions/${q.id}/save`, { method: 'POST', body: {} }); q.saved = s.saved; btn.classList.toggle('gold', s.saved); btn.classList.toggle('ghost', !s.saved); btn.querySelector('span').textContent = s.saved ? 'Saved' : 'Save as difficult'; toast(s.saved ? 'Saved to difficult questions' : 'Removed from saved', 'ok'); } catch (er) { errToast(er); } };
      $('#nextBtn', el).onclick = () => { if (st.i + 1 < qs.length) { st.i++; show(); window.scrollTo(0, 0); } else finish(); };
      $('#nextBtn', el).focus();
    };
  }
  async function finish() {
    document.removeEventListener('keydown', onKey);
    const total = st.res.length; const ok = st.res.filter(r => r.correct).length; const acc = total ? Math.round(100 * ok / total) : 0;
    if (total) api('/api/practice/session', { method: 'POST', body: { subject: meta.subject, topic: meta.topic, correct: ok, total } }).catch(() => { });
    const byTopic = {}; st.res.forEach(r => { const b = byTopic[r.q.topic] || (byTopic[r.q.topic] = { n: 0, ok: 0 }); b.n++; if (r.correct) b.ok++; });
    const wrong = st.res.filter(r => !r.correct);
    el.innerHTML = `<div class="page-head"><div><h1>Session complete</h1><p>${esc(sub.short)}${meta.topic ? ' · ' + esc(meta.topic) : ''}</p></div></div>
      ${total ? `<div class="grid g3 mb"><div class="card row">${ring(acc, { color: acc >= 70 ? 'var(--ok)' : acc >= 50 ? 'var(--warn)' : 'var(--bad)' })}<div><div class="stat"><span class="v">${ok}/${total}</span><span class="l">Score</span></div><div class="muted sm-t">${acc >= 80 ? 'Excellent! 🌟' : acc >= 60 ? 'Good, keep going.' : 'Needs more revision — review below.'}</div></div></div>
      <div class="card stat"><span class="v">${acc}%</span><span class="l">Accuracy</span><span class="muted sm-t">${wrong.length} incorrect</span></div>
      <div class="card"><h3>By topic</h3><div class="list">${Object.entries(byTopic).map(([t, v]) => `<div class="row"><span class="grow sm-t">${esc(t)}</span><span class="chip ${v.ok / v.n >= .6 ? 'ok' : 'bad'}">${v.ok}/${v.n}</span></div>`).join('')}</div></div></div>
      <div class="row wrap mb"><button class="btn" id="again">${icon('refresh')} Practise again</button>${wrong.length ? `<button class="btn soft" id="revWrong">${icon('eye')} Review ${wrong.length} incorrect answer${wrong.length > 1 ? 's' : ''}</button>` : ''}<a class="btn ghost" href="#/dashboard">Back to dashboard</a></div>
      <div id="reviewBox"></div>` : empty('target', 'No questions answered', '<a class="btn mt" href="#/practice">Start again</a>')}`;
    if (!total) return;
    $('#again', el).onclick = () => { S.presetPractice = { subject: meta.subject, topic: meta.topic }; renderRoute(); };
    const rv = $('#revWrong', el);
    if (rv) rv.onclick = () => { $('#reviewBox', el).innerHTML = `<h2>Review incorrect answers</h2><div class="grid">${wrong.map(r => reviewCard(r.q, r.chosen, r.answer, r.explanation)).join('')}</div>`; $('#reviewBox', el).scrollIntoView({ behavior: 'smooth' }); bindSaveButtons($('#reviewBox', el)); };
  }
  show();
}
function reviewCard(q, chosen, answer, explanation) {

route('tests', async (el) => {
  const hist = await api('/api/tests');
  const visibleSubjects = stageSubjects();
  const visibleIds = new Set(visibleSubjects.map(s => s.id));

    try { await api(`/api/tests/${active.id}/submit`, { method: 'POST', body: { answers: active.answers, secondsUsed: active.minutes * 60 } }); } catch { /* ignore */ }
    localStorage.removeItem(ACTIVE_KEY); active = null; return renderRoute();
  }
  const doneToday = id => hist.find(t => t.subject === id && isToday(t.finished));
  function paint() {
    el.innerHTML = `${setupBanner()}
      <div class="page-head"><div><h1>Daily Tests</h1><p>One focused, timed test per subject every day. Results, explanations and weak topics are saved automatically.</p></div></div>
      ${active ? `<div class="banner" style="background:var(--primary-soft);color:var(--primary)">${icon('clock')}<div class="grow"><b>You have a test in progress</b>${esc(subjOf(active.subject).short)} · ${active.questions.length} questions</div><button class="btn sm" id="resumeBtn">Resume test</button></div>` : ''}
      <div class="grid g3 mb">${visibleSubjects.map(s => { const d = doneToday(s.id); return `<div class="card" style="border-top:4px solid ${s.color}"><div class="row"><div class="avatar" style="--c:${s.color}">${icon(s.icon)}</div><div class="grow"><b>${esc(s.short)}</b><div class="muted sm-t">Today's test</div></div>${d ? `<span class="chip ${d.pct >= 60 ? 'ok' : 'bad'}">${d.pct}%</span>` : '<span class="chip warn">Not taken</span>'}</div></div>`; }).join('')}</div>

      <div class="grid g2 mb"><div class="card"><h3>Performance comparison</h3><div id="cmp"></div></div><div class="card"><h3>Weak topics from tests</h3><div id="weak"></div></div></div>

    bindSubjectPicker(el, 'subjPick', s => { subject = s; rememberSubject(s); $('#topicSel', el).innerHTML = topicOptions(s, 'Mixed – whole subject'); });
    const nQ = $('#nQ', el), nMin = $('#nMin', el); nQ.oninput = () => { nMin.value = Math.max(3, Math.round((+nQ.value || 10) * 1.2)); };
    $('#startBtn', el).onclick = startTest; if (active) $('#resumeBtn', el).onclick = () => runTest(el, active);
    // comparison chart
    const bySub = visibleSubjects.map(s => ({ s, pts: hist.filter(t => t.subject === s.id).reverse().map(t => t.pct) }));
    const maxN = Math.max(0, ...bySub.map(x => x.pts.length));
    $('#cmp', el).innerHTML = maxN ? `${lineChart(bySub.filter(x => x.pts.length).map(x => ({ name: x.s.short, color: x.s.color, points: x.pts })), { labels: Array.from({ length: maxN }, (_, i) => '#' + (i + 1)) })}<div class="row wrap sm-t">${bySub.map(x => `<span class="chip"><i style="width:9px;height:9px;border-radius:50%;background:${x.s.color};display:inline-block"></i> ${esc(x.s.short)}${x.pts.length ? ' · avg ' + Math.round(x.pts.reduce((a, b) => a + b, 0) / x.pts.length) + '%' : ''}</span>`).join('')}</div>` : empty('chart', 'No tests yet', 'Take your first test to see score trends.');
    const weak = {}; hist.filter(t => visibleIds.has(t.subject)).slice(0, 15).forEach(t => t.weak.forEach(w => { const k = t.subject + '|' + w.topic; weak[k] = (weak[k] || 0) + 1; }));
    const wl = Object.entries(weak).sort((a, b) => b[1] - a[1]).slice(0, 6);
    $('#weak', el).innerHTML = wl.length ? `<div class="list">${wl.map(([k, n]) => { const [s, t] = k.split('|'); return `<div class="row"><div class="grow"><div>${esc(t)}</div><div class="muted sm-t">${esc(subjOf(s).short)} · weak in ${n} test${n > 1 ? 's' : ''}</div></div><a class="btn sm soft" href="#/practice" data-p="${esc(k)}">Practise</a></div>`; }).join('')}</div>` : empty('target', 'No weak topics yet', 'Topics where you score below 60% in a test will be listed here.');

function runTest(el, t) {
  const sub = subjOf(t.subject); S.trackSubject = t.subject; let submitted = false;
  const save = () => { try { localStorage.setItem(ACTIVE_KEY, JSON.stringify(t)); } catch { /* ignore */ } };
  const end = t.started + t.minutes * 60000;
  const left = () => Math.max(0, Math.round((end - Date.now()) / 1000));
  el.innerHTML = `<div class="sticky-bar"><div class="card row between" style="padding:.7rem 1rem"><div><b>${esc(sub.short)}</b> <span class="muted sm-t">${t.topic ? '· ' + esc(t.topic) : ''}</span></div><div class="timer" id="timer">${fmtClock(left())}</div><button class="btn sm" id="submitBtn">Submit test</button></div></div>
    <div class="grid mt" style="grid-template-columns:minmax(0,1fr) 220px;align-items:start" id="tgrid"><div class="card" id="qcard"></div><div class="card"><h3>Questions</h3><div class="qnav" id="qnav"></div><div class="muted sm-t mt-s">${icon('flag')} = flagged for review</div></div></div>`;
  $('#tgrid', el).style.cssText = window.innerWidth < 900 ? 'display:grid;grid-template-columns:1fr' : 'display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:1rem;align-items:start';
  function paint() {
    const q = t.questions[t.cur];
    $('#qcard', el).innerHTML = `<div class="row between"><span class="chip">Question ${t.cur + 1} of ${t.questions.length}</span><button class="btn sm ${t.flags.includes(t.cur) ? 'gold' : 'ghost'}" id="flagBtn">${icon('flag')} ${t.flags.includes(t.cur) ? 'Flagged' : 'Flag'}</button></div><div class="qtext mt-s">${esc(q.question)}</div>
      <div class="grid">${q.options.map((o, i) => `<button class="opt ${t.answers[t.cur] === i ? 'pick' : ''}" data-i="${i}"><span class="k">${LETTERS[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
      <div class="row between mt"><button class="btn ghost" id="prev" ${t.cur === 0 ? 'disabled' : ''}>Previous</button><button class="btn ghost sm" id="clr">Clear answer</button><button class="btn" id="next">${t.cur === t.questions.length - 1 ? 'Review & submit' : 'Next'}</button></div>`;
    $('#qnav', el).innerHTML = t.questions.map((_, i) => `<button class="${t.answers[i] !== null ? 'ans' : ''} ${i === t.cur ? 'cur' : ''} ${t.flags.includes(i) ? 'flag' : ''}" data-n="${i}">${i + 1}</button>`).join('');
  }
  el.onclick = e => {
    const o = e.target.closest('.opt'); if (o) { t.answers[t.cur] = +o.dataset.i; save(); paint(); return; }
    const n = e.target.closest('[data-n]'); if (n) { t.cur = +n.dataset.n; save(); paint(); return; }
    if (e.target.closest('#prev')) { t.cur--; save(); paint(); } else if (e.target.closest('#next')) { if (t.cur < t.questions.length - 1) { t.cur++; save(); paint(); } else submit(false); }
    else if (e.target.closest('#clr')) { t.answers[t.cur] = null; save(); paint(); }
    else if (e.target.closest('#flagBtn')) { const k = t.flags.indexOf(t.cur); k >= 0 ? t.flags.splice(k, 1) : t.flags.push(t.cur); save(); paint(); }
    else if (e.target.closest('#submitBtn')) submit(false);
  };
  async function submit(auto) {
    if (submitted) return;
    const un = t.answers.filter(a => a === null).length;
    if (!auto && !(await confirmDialog(un ? `${un} question${un > 1 ? 's are' : ' is'} unanswered. Submit anyway?` : 'Submit your test now?', 'Submit'))) return;
    submitted = true; clearInterval(tick); el.onclick = null; el.innerHTML = loading('Marking your test…');
    try {
      const used = Math.min(t.minutes * 60, Math.round((Date.now() - t.started) / 1000));
      const r = await api(`/api/tests/${t.id}/submit`, { method: 'POST', body: { answers: t.answers, secondsUsed: used } });
      localStorage.removeItem(ACTIVE_KEY); showTestResult(el, { ...r, subject: t.subject, topic: t.topic, weakList: r.weak });
    } catch (e) { submitted = false; errToast(e); runTest(el, t); }
  }
  const tick = setInterval(() => { const l = left(); const tm = $('#timer', el); if (tm) { tm.textContent = fmtClock(l); tm.classList.toggle('low', l <= 60); } window.touchActivity && window.touchActivity(); if (l <= 0) { toast("Time's up! Submitting your test…"); submit(true); } }, 1000);
  S.cleanup = () => clearInterval(tick);
  paint();
}

function showTestResult(el, r) {
  const sub = subjOf(r.subject); S.cleanup = null;
  const weak = r.weakList || r.weak || []; const color = r.pct >= 70 ? 'var(--ok)' : r.pct >= 50 ? 'var(--warn)' : 'var(--bad)';
  const cmp = r.previousAverage === null || r.previousAverage === undefined ? '' : (r.pct >= r.previousAverage ? `<span style="color:var(--ok)">▲ ${r.pct - r.previousAverage}% above</span>` : `<span style="color:var(--bad)">▼ ${r.previousAverage - r.pct}% below</span>`) + ` your previous average (${r.previousAverage}%)`;
  el.innerHTML = `<div class="page-head"><div><h1>Test result</h1><p>${esc(sub.short)}${r.topic ? ' · ' + esc(r.topic) : ''}</p></div><button class="btn ghost" onclick="renderRoute()">${icon('arrow')} Back to tests</button></div>
    <div class="grid g3 mb"><div class="card row">${ring(r.pct, { color })}<div><div class="stat"><span class="v">${r.score}/${r.total}</span><span class="l">Score</span></div><div class="muted sm-t">${cmp}</div></div></div>
      <div class="card"><h3>Topic performance</h3>${r.topics?.length ? `<div class="list">${r.topics.map(t => `<div class="row"><span class="grow sm-t">${esc(t.topic)}</span><span class="chip ${t.correct / t.total >= .6 ? 'ok' : 'bad'}">${t.correct}/${t.total}</span></div>`).join('')}</div>` : '<div class="muted">Detailed topic split is shown right after a test.</div>'}</div>
      <div class="card"><h3>Weak topics</h3>${weak.length ? `<div class="list">${weak.map(w => `<div class="row"><span class="grow sm-t">${esc(w.topic)}</span><span class="chip bad">${w.correct}/${w.total}</span><button class="btn sm soft" data-rev="${esc(w.topic)}">Add to revision</button></div>`).join('')}</div>` : '<div class="chip ok">No weak topics in this test 🎉</div>'}</div></div>
    <div class="row between mb"><h2 style="margin:0">Answers & explanations</h2><div class="tabs"><button class="tab active" data-f="all">All</button><button class="tab" data-f="bad">Incorrect</button></div></div>
    <div class="grid" id="det">${r.details.map((d, i) => `<div data-ok="${d.correct ? 1 : 0}">${reviewCard({ ...d }, d.chosen, d.answer, d.explanation).replace('<span class="chip">', `<span class="chip ${d.correct ? 'ok' : 'bad'}">Q${i + 1} · ${d.correct ? '✓ ' : '✗ '}`)}</div>`).join('')}</div>`;
  bindSaveButtons(el);
  $$('[data-rev]', el).forEach(b => b.onclick = async () => { try { await api('/api/revision', { method: 'POST', body: { subject: r.subject, text: b.dataset.rev } }); toast('Added to revision list', 'ok'); b.disabled = true; } catch (e) { errToast(e); } });
  $$('.tabs [data-f]', el).forEach(b => b.onclick = () => { $$('.tabs [data-f]', el).forEach(x => x.classList.toggle('active', x === b)); $$('#det > div', el).forEach(d => d.classList.toggle('hide', b.dataset.f === 'bad' && d.dataset.ok === '1')); });
}

<script>

/* Study library + notes, summaries, flashcards, revision list */

let pdfjsPromise = null;
function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (pdfjsPromise) return pdfjsPromise;
  pdfjsPromise = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = async () => {
      const W = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      try { // load the worker through a blob URL so it also works when the page is opened from a file
        const code = await (await fetch(W)).text();
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
      } catch { window.pdfjsLib.GlobalWorkerOptions.workerSrc = W; }
      res(window.pdfjsLib);
    };
    s.onerror = () => rej(new Error('pdf.js could not be loaded')); document.head.appendChild(s);
  });
  return pdfjsPromise;
}
async function pdfText(buf) {
  const lib = await loadPdfJs(); const pdf = await lib.getDocument({ data: buf.slice(0) }).promise; let out = '';
  for (let p = 1; p <= Math.min(pdf.numPages, 400); p++) {
    const pg = await pdf.getPage(p); const c = await pg.getTextContent(); let line = '', lastY = null;
    for (const it of c.items) { if (lastY !== null && Math.abs(it.transform[5] - lastY) > 4) line += '\n'; line += it.str + ' '; lastY = it.transform[5]; }
    out += line + '\n\n';
  }
  return out;
}
function readAsArrayBuffer(f) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error('Could not read ' + f.name)); r.readAsArrayBuffer(f); }); }
function toBase64(buf) { let bin = ''; const b = new Uint8Array(buf); for (let i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(bin); }
const FILE_ICON = { pdf: 'file', docx: 'file', txt: 'file', md: 'file' };
